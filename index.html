<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pyper's สต๊อก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
  --tx:#e9ecf1; --mut:#8e97a8; --acc:#e8734a; --acc2:#f29470;
  --ok:#3fb27f; --bad:#e2574c; --warn:#e0a63c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.55}
body{padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hd{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
.hd h1{font-size:17px;margin:0;font-weight:600;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{font-size:12px;color:var(--mut);font-weight:400}
.back{background:none;border:none;color:var(--acc);font-size:24px;padding:0 6px 0 0;cursor:pointer;line-height:1}
.who{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}
.who b{display:block;color:var(--tx);font-size:13px;font-weight:600}
main{flex:1;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:600}
.mut{color:var(--mut)}
.sm{font-size:13px}
.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
label.fl{display:block;font-size:13px;color:var(--mut);margin:0 0 5px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:12px;font-size:17px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
select{-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%238e97a8' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
.fld{margin-bottom:12px}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border:none;border-radius:12px;
  padding:15px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer}
.btn:active{background:var(--acc2)}
.btn[disabled]{opacity:.45}
.btn.gh{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:500}
.btn.sm2{padding:10px;font-size:14px}
.tile{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:15px;margin-bottom:10px;cursor:pointer;width:100%;text-align:right;
  color:var(--tx);font-family:inherit}
.tile:active{background:var(--card2)}
.tile .ic{font-size:25px;width:34px;text-align:center;flex-shrink:0}
.tile .tx{flex:1;text-align:left;min-width:0}
.tile .tx b{display:block;font-size:16px;font-weight:600}
.tile .tx span{font-size:12.5px;color:var(--mut)}
.tile .ar{color:var(--mut);font-size:20px}
.badge{background:var(--acc);color:#fff;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.lst{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.li .nm{flex:1;min-width:0;font-size:15px}
.li .nm small{display:block;color:var(--mut);font-size:11.5px}
.li input{width:96px;padding:9px;font-size:16px}
.li .u{width:36px;font-size:12px;color:var(--mut);text-align:left}
.li.miss input:placeholder-shown:not(.qr){border-color:var(--bad);background:rgba(220,70,70,.08)}
.li.miss .nm{color:var(--bad)}
.sug{color:var(--acc);font-weight:600}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:3px 11px;font-size:12.5px;color:var(--mut);margin:0 0 0 6px}
.note{background:rgba(232,115,74,.09);border:1px solid rgba(232,115,74,.3);border-radius:10px;
  padding:10px 12px;font-size:13px;color:var(--acc2);margin-bottom:12px}
.err{background:rgba(226,87,76,.12);border:1px solid rgba(226,87,76,.4);color:#ffb3ad}
.li input.pf{color:var(--mut)}
.okbox{background:rgba(63,178,127,.1);border:1px solid rgba(63,178,127,.35);color:#9fe3c2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kbd{font-variant-numeric:tabular-nums;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:14px}
.pin button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:14px;
  padding:17px 0;font-size:24px;font-weight:600;font-family:inherit;cursor:pointer}
.pin button:active{background:var(--acc)}
.dots{display:flex;gap:12px;justify-content:center;margin:18px 0 4px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--card2);border:1px solid var(--line)}
.dots i.on{background:var(--acc);border-color:var(--acc)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:13px;
  padding:16px 8px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer}
.names button:active{background:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(17,20,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0}
.sheetbox{background:var(--card,#fff);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.tok{font:700 34px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;text-align:center;padding:14px 0 6px}
.sheetbox .btn{margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:99;
  background:#22262f;border:1px solid var(--line);border-radius:12px;padding:13px 18px;font-size:15px;
  max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.ok{border-color:var(--ok)} .toast.bad{border-color:var(--bad)}
.ldg{text-align:center;color:var(--mut);padding:44px 0}
.ph{width:100%;border-radius:12px;margin-top:10px;display:block}
hr.d{border:none;border-top:1px solid var(--line);margin:14px 0}
.tot{display:flex;justify-content:space-between;align-items:baseline;background:var(--card2);
  border-radius:11px;padding:11px 13px;margin-top:10px}
/* ---- กราฟ ---- */
.viz{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--track:#272c36}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hero .t{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.hero .t b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.hero .t span{font-size:11px;color:var(--mut);display:block;margin-top:3px}
.lgd{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 12px}
.lgd i{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);font-style:normal}
.dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.meter{display:flex;height:26px;background:var(--track);border-radius:6px;overflow:hidden;gap:2px;margin:8px 0 2px}
.meter i{display:block;min-width:2px}
.meter i:first-child{border-radius:6px 0 0 6px}
.meter i.last{border-radius:0 6px 6px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums;font-weight:600}
.brow{display:grid;grid-template-columns:104px 1fr auto;align-items:center;gap:9px;margin:7px 0;font-size:13px}
.brow .bar{height:16px;background:var(--track);border-radius:5px;overflow:hidden}
.brow .bar i{display:block;height:100%;border-radius:5px}
.brow .v{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--mut);white-space:nowrap}
.seg{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.seg .p{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:10px;
  padding:9px;font-size:13.5px;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.empty{color:var(--mut);font-size:12.5px;padding:6px 0}
/* ---- เช็กลิสต์ ---- */
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:none}
.ck .mk{font-size:17px;line-height:1.3;width:20px;flex-shrink:0}
.ck .bd{flex:1;min-width:0}
.ck .bd b{display:block;font-size:14.5px;font-weight:500}
.ck .bd span{font-size:12px;color:var(--mut)}
.ck.no .bd b{color:var(--warn)}
.bar{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.plus{color:var(--mut);font-size:13px;padding:0 2px}
.diffneg{color:var(--bad);font-weight:600}
.diffpos{color:var(--warn);font-weight:600}
.diffz{color:var(--ok);font-weight:600}
.tri{display:flex;gap:4px;flex-shrink:0}
.tri button{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:8px 9px;font-size:13px;font-family:inherit;cursor:pointer}
.tri button.on[data-v=ok]{background:var(--ok);border-color:var(--ok);color:#fff}
.tri button.on[data-v=low]{background:var(--warn);border-color:var(--warn);color:#111}
.tri button.on[data-v=out]{background:var(--bad);border-color:var(--bad);color:#fff}
</style>
</head>
<body>
<div id="app"><div class="ldg">กำลังเปิดระบบ…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   Pyper's · ระบบสต๊อก
   หน้าเดียว ใช้ได้ทั้งโรงงาน สาขา และเจ้าของ · สิทธิ์คุมด้วย RLS ที่ฐานข้อมูล
   ============================================================ */
const SB_URL = 'https://wrkssltjzqtwqfrnnajv.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indya3NzbHRqenF0d3Fmcm5uYWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNTQzNTAsImV4cCI6MjEwMTkzMDM1MH0.EMsTd0xa7XoJTaOb2M-yS-kIBsFIAOfyV6eFpLYC2Rw';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { db:{schema:'stock'}, auth:{persistSession:true} });

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n)?n:0; };
const fmt = (n,d=0) => (Math.round(num(n)*10**d)/10**d).toLocaleString('th-TH',{maximumFractionDigits:d});
// "พอขายอีกกี่วัน" = ที่สาขาเหลือ ÷ ขายเฉลี่ยต่อวันจาก POS · เทียบรอบส่งหน้า (วันจันทร์) — ความจริง ไม่ใช่คำแนะนำ
const ddmm = s => s ? String(s).slice(8,10)+'/'+String(s).slice(5,7) : '';
const dnext = s => s ? ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'][new Date(String(s).slice(0,10)+'T00:00:00').getDay()] + ' ' + ddmm(s) : '';
const rwShort = l => String(l||'').replace('Dip ','').replace(' 20 กรัม','');
async function loadRunway(){
  try{ const { data, error } = await sb.rpc('fn_runway', { p_as_of: today() }); return error ? [] : (data||[]); }catch(e){ return []; }
}
const rwLine = x => `${x.level==='red'?'🔴':'🟠'} <b>${esc(rwShort(x.label))}</b> เหลือ ${fmt(x.on_hand)} · ขายวันละ ~${fmt(x.per_day,1)} → หมดราว ${ddmm(x.runs_out_on)}`;
const rwHot = rw => rw.filter(x=>x.level!=='ok').sort((a,b)=>(a.level===b.level?0:(a.level==='red'?-1:1)) || num(a.days_left)-num(b.days_left));
const rwNote = x => `<span class="${x.level==='red'?'diffneg':(x.level==='orange'?'diffpos':'mut')}">พอขาย ~${fmt(x.days_left,1)} วัน</span>`;
const today = () => new Date().toLocaleDateString('sv-SE');
const LOCKMIN = 15, MAXTRY = 5;

let S = { me:null, loc:null, M:null, onhand:new Map(), set:{} };

function toast(msg, kind='ok'){
  const t = document.createElement('div');
  t.className = 'toast '+kind; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), kind==='bad'?5200:2600);
}
function busy(btn, on, label){
  if(!btn) return;
  if(on){ btn.dataset.lb = btn.textContent; btn.textContent='กำลังบันทึก…'; btn.disabled=true; }
  else { btn.textContent = label || btn.dataset.lb || 'บันทึก'; btn.disabled=false; }
}
function errMsg(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if(/row-level security/i.test(m)) return 'บัญชีนี้ไม่มีสิทธิ์บันทึกที่นี่';
  if(/Invalid login/i.test(m)) return 'รหัสไม่ถูกต้อง';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'เน็ตหลุด — ลองใหม่อีกครั้ง';
  return m;
}

/* ---------------- หน้าจอ ---------------- */
const SCREENS = [
  {id:'make',  ic:'🥣', nm:'ทำไส้',              sb:'บันทึกไส้ที่ทำได้วันนี้ (กก.)',        at:'factory'},
  {id:'roll',  ic:'🌯', nm:'ม้วน',               sb:'เบิกไส้ · ม้วนได้กี่ชิ้น · ใครม้วน',   at:'factory'},
  {id:'sauce', ic:'🥫', nm:'ผสม / แบ่งบรรจุ',   sb:'Dip · เทเทอร์ท็อต — กรอกวัตถุดิบหลักตัวเดียว', at:'factory'},
  {id:'ship',  ic:'🚚', nm:'จัดของส่งสาขา',     sb:'ระบบคิดให้ว่าส่งอะไรกี่ถุง',            at:'factory'},
  {id:'recv',  ic:'📥', nm:'รับของคืนจากสาขา',  sb:'ตรวจของที่สาขาส่งกลับมา',               at:'factory'},
  {id:'count', ic:'📋', nm:'นับสต๊อกโรงงาน',    sb:'นับของจริง แล้วเทียบกับที่ควรเหลือ',   at:'factory'},
  {id:'inn',   ic:'📥', nm:'ของเข้าโรงงาน',      sb:'ซื้อวัตถุดิบเข้า หรือเจ้าของทำเองมาส่ง', at:'factory'},
  {id:'waste', ic:'🗑️', nm:'แจ้งของเสีย',       sb:'ต้องถ่ายรูปหลักฐานทุกครั้ง',            at:'factory'},

  {id:'count', ic:'📋', nm:'นับสต๊อกประจำวัน',  sb:'นับถุงที่ยังไม่แกะ + ชิ้นที่แกะแล้ว',  at:'branch'},
  {id:'recv',  ic:'📦', nm:'รับของ',             sb:'ตรวจของที่โรงงาน/สาขาอื่นส่งมา',       at:'branch'},
  {id:'b2b',   ic:'↔️', nm:'ส่งของไปที่อื่น',    sb:'สาขาอื่น หรือส่งคืนโรงงาน',             at:'branch'},
  {id:'waste', ic:'🗑️', nm:'แจ้งของเสีย',       sb:'ต้องถ่ายรูปหลักฐานทุกครั้ง',            at:'branch'},
];

/* ---------------- เริ่มต้น ---------------- */
(async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return viewLogin();
  await loadMe();
})();

async function loadMe(){
  app.innerHTML = '<div class="ldg">กำลังโหลดข้อมูล…</div>';
  try{
    const { data:me, error } = await sb.rpc('fn_me');
    if(error) throw error;
    if(!me || !me.length){ await sb.auth.signOut(); return viewLogin('บัญชีนี้ยังไม่ได้ผูกกับพนักงาน'); }
    S.me = me[0];
    await loadMaster();
    pickLocation();
  }catch(e){ app.innerHTML=''; toast(errMsg(e),'bad'); viewLogin(); }
}

async function loadMaster(){
  const [br, it, pk, wr, em, st, ct, cc, rc] = await Promise.all([
    sb.from('branches').select('id,code,name,kind,opened_on,closed_on').order('kind').order('name'),
    sb.from('stock_items').select('id,level,label,unit_base,unit_major,at_factory_only,active,'+
       'products(id,code,name,sort_order,active,chilled,categories(id,code,name,sort_order,unit_base,unit_major))'),
    sb.from('pack_sizes').select('stock_item_id,base_per_major,effective_from,effective_to'),
    sb.from('waste_reasons').select('id,code,name,sort_order').eq('active',true).order('sort_order'),
    sb.from('employees').select('id,nickname,job_type').eq('active',true).order('nickname'),
    sb.from('settings').select('key,value'),
    sb.from('categories').select('id,code,name,sort_order'),
    sb.from('category_capacity').select('branch_id,category_id,capacity_base,effective_from,effective_to'),
    sb.from('recipes').select('output_item_id,input_item_id,qty_per_batch,effective_from,effective_to'),
  ]);
  for(const r of [br,it,pk,wr,em,st,ct,cc,rc]) if(r.error) throw r.error;
  // ของที่นับเฉพาะบางที่ (ของใช้ที่พนักงานเพิ่มเอง) · ไม่มีแถว = ทุกที่
  const locsOf = new Map();
  try{ const il = await sb.from('item_locations').select('stock_item_id,branch_id');
    (il.data||[]).forEach(r=>{ if(!locsOf.has(r.stock_item_id)) locsOf.set(r.stock_item_id, []); locsOf.get(r.stock_item_id).push(r.branch_id); }); }catch(e){}

  const d = today();
  const packs = new Map();
  pk.data.forEach(p=>{ if(d>=p.effective_from && (!p.effective_to || d<p.effective_to)) packs.set(p.stock_item_id, num(p.base_per_major)); });

  const items = it.data.filter(x=>x.active && x.products && x.products.active).map(x=>({
    id:x.id, level:x.level, label:x.label, ub:x.unit_base, um:x.unit_major,
    fac:x.at_factory_only, pcode:x.products.code, pname:x.products.name,
    psort:x.products.sort_order, cat:x.products.categories.code, chilled:!!x.products.chilled,
    catname:x.products.categories.name, csort:x.products.categories.sort_order,
    bpm: packs.get(x.id) || 1, locs: locsOf.get(x.id) || null,
  })).sort((a,b)=> a.csort-b.csort || a.psort-b.psort || a.label.localeCompare(b.label,'th'));

  S.set = Object.fromEntries(st.data.map(r=>[r.key, r.value]));
  // ความจุตู้แช่ปอเปี๊ยะของแต่ละสาขา (ใช้วาดหลอดเต็ม/ว่าง)
  const rollCat = (ct.data.find(c=>c.code==='ROLL')||{}).id;
  const sauceCat = (ct.data.find(c=>c.code==='SAUCE')||{}).id;
  const cap = new Map(), capSauce = new Map();   // ตู้แช่ปอเปี๊ยะ · ตู้เย็นซอส (Dip แช่เย็น)
  cc.data.forEach(c=>{
    if(!(d >= c.effective_from && (!c.effective_to || d < c.effective_to))) return;
    if(c.category_id === rollCat) cap.set(c.branch_id, num(c.capacity_base));
    if(c.category_id === sauceCat) capSauce.set(c.branch_id, num(c.capacity_base));
  });
  // สูตร: ปอเปี๊ยะ = กก.ต่อ 1 ชิ้น · Dip = กก.ต่อ 1 รอบผสม
  const rec = new Map();
  rc.data.forEach(r=>{
    if(!(d >= r.effective_from && (!r.effective_to || d < r.effective_to))) return;
    if(!rec.has(r.output_item_id)) rec.set(r.output_item_id, []);
    rec.get(r.output_item_id).push({ input: r.input_item_id, qty: num(r.qty_per_batch) });
  });
  S.M = {
    cap, capSauce, cats: ct.data, rec,
    branches: br.data.filter(b=>!b.closed_on || b.closed_on > d),
    allBranches: br.data,
    items, reasons: wr.data, emps: em.data, flags: [],
  };
  // ของใช้ที่กดแค่สถานะ พอ/ใกล้หมด/หมด
  try{
    const f = await sb.from('supply_flags').select('id,code,label,sort_order').eq('active',true).order('sort_order');
    if(!f.error) S.M.flags = f.data || [];
  }catch(e){}
}

/* ---------------- ล็อกอิน ---------------- */
function lockKey(c){ return 'pl_'+c; }
function lockLeft(c){
  try{
    const r = JSON.parse(localStorage.getItem(lockKey(c))||'{}');
    if(r.until && r.until > Date.now()) return Math.ceil((r.until-Date.now())/60000);
  }catch(e){}
  return 0;
}
function lockBump(c){
  let r={}; try{ r = JSON.parse(localStorage.getItem(lockKey(c))||'{}'); }catch(e){}
  r.n = (r.n||0)+1;
  if(r.n >= MAXTRY){ r.until = Date.now()+LOCKMIN*60000; r.n = 0; }
  localStorage.setItem(lockKey(c), JSON.stringify(r));
  return r.until ? LOCKMIN : MAXTRY - r.n;
}
function lockClear(c){ localStorage.removeItem(lockKey(c)); }

function boxTxt(qty, bpm, um, ub){

  if(!(bpm>1)) return `${fmt(qty, ub==='กก.'?1:0)} ${ub}`;

/* --- ย่อรูปก่อนอัป --- */
function shrink(file, max=1280, q=.72){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const sc = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=> b?res(b):rej(new Error('ย่อรูปไม่สำเร็จ')), 'image/jpeg', q);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = ()=>rej(new Error('เปิดรูปไม่ได้'));
    img.src = URL.createObjectURL(file);
  });
}
async function upPhoto(file){
  const blob = await shrink(file);
  const path = `${S.loc.code}/${today()}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType:'image/jpeg' });
  if(error) throw error;
  return path;
}

        <div class="bd"><b>${esc(r.label)} · ${fmt(r.batches,2)} สูตร</b>
        <span>ควรได้ ${fmt(r.should_kg,2)} กก. · ได้จริง ${fmt(r.got_kg,2)} กก.
        <span class="${cls}">${d>=0?'+':''}${fmt(d,2)} กก. (${d>=0?'+':''}${fmt(pct,1)}%)</span></span></div></div>`;
    }).join('')}
    <div class="xs mut" style="margin-top:8px">ต่างจากสูตรเกิน 3% = น่าดูว่าชั่งพลาด ของหก หรือสูตรเปลี่ยนไปแล้ว</div>
  </div>
  <button class="btn gh" id="rdone">เสร็จแล้ว · กลับหน้าหลัก</button>`;
  $('#rdone').onclick = ()=>viewHome();
}

/* ============================================================
   2 · ม้วน  (ม้วนเสร็จ เข้ากล่อง แช่แข็งเลย — ไม่มีขั้นบรรจุถุงแล้ว)
   ============================================================ */
function scRoll(){
  const rolls = S.M.items.filter(x=>x.level==='packed' && x.cat==='ROLL');
  const fill = p => S.M.items.find(x=>x.level==='filling' && x.pcode===p);
  let rollers = [{by:'',qty:''}];
  let stats = [];   // กรัม/ชิ้น ของรอบก่อน ๆ — ของจริง ไม่ใช่สูตรสมมติ

  const render = async ()=>{
    const w = item($('#fv').value), f = fill(w.pcode);
    app.querySelector('#body').innerHTML = boxes(f, w);
    bind(f, w);
    stats = [];
    try{
      const { data } = await sb.rpc('fn_roll_stats', { p_item: w.id, p_limit: 5 });
      stats = data || [];
    }catch(e){}
    const el = $('#gpp'); if(el) el.dispatchEvent(new Event('refresh'));
    if($('#hist')) $('#hist').innerHTML = stats.length
      ? `<div class="xs mut" style="margin-top:8px">รอบก่อน ๆ: ${stats.map(r=>
          `${fmt(r.g_per_piece,1)}`).join(' · ')} กรัม/ชิ้น</div>`
      : `<div class="xs mut" style="margin-top:8px">ยังไม่เคยบันทึกการม้วนไส้นี้ — รอบนี้จะเป็นรอบแรก</div>`;
    if($('#hist') && !(S.M.rec.get(item($('#fv').value).id)||[]).length)
      $('#hist').innerHTML += `<div class="xs mut">ไส้นี้ยังไม่ได้ตั้งสูตรกรัม/ชิ้น</div>`;
  };
  const boxes = (f, w) => `
    <div class="card"><h3>เบิกไส้${esc(f.pname)}</h3>
      <div class="xs mut" style="margin:-4px 0 10px">คลังมี ${fmt(oh(f.id),1)} กก. · 1 กล่องไส้ = ${fmt(f.bpm,1)} กก.</div>
      <div class="grid3">
        <div><label class="fl">กล่องเต็ม</label><input id="q_full" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></div>
        <div><label class="fl">เศษ (กก.)</label><input id="q_part" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
        <div><label class="fl">คืนคลัง (กก.)</label><input id="q_ret" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
      </div>
      <div class="tot"><span class="sm mut">ไส้ที่ใช้จริง</span><span class="big" id="used">0 <span class="sm mut">กก.</span></span></div>
    </div>
    <div class="card"><h3>ม้วนได้กี่ชิ้น · ใครม้วน</h3>
      <div id="rl"></div>
      <button class="btn gh sm2" id="addr" style="margin-top:8px">+ เพิ่มคนม้วน</button>
      <div class="tot"><span class="sm mut">รวมม้วนได้</span><span class="big" id="tq">0 <span class="sm mut">ชิ้น</span></span></div>
      <div class="tot" style="margin-top:6px"><span class="sm mut">เข้ากล่องได้</span><span class="big" id="bx">0 <span class="sm mut">กล่อง</span></span></div>
      <div class="xs" id="gpp" style="margin-top:8px"></div>
      <div id="hist"></div>
    </div>`;

  const bind = (f,w)=>{
    // สูตรไส้ต่อชิ้น (กรัม) — มาจากเจ้าของ ไม่ใช่ค่าที่ระบบเดา
    const std = (S.M.rec.get(w.id) || []).reduce((a,r)=>a+r.qty, 0) * 1000;
    const drawR = ()=>{
      $('#rl').innerHTML = rollers.map((r,i)=>`<div class="li">
        <div class="nm"><select data-ri="${i}" class="rby">
          <option value="">— เลือกคนม้วน —</option>
          ${S.M.emps.map(e=>`<option value="${e.id}" ${r.by===e.id?'selected':''}>${esc(e.nickname)}</option>`).join('')}
        </select></div>
        <input type="number" inputmode="numeric" min="0" step="1" class="rq" data-ri="${i}" value="${r.qty}" placeholder="0">
        <div class="u">ชิ้น</div>
      </div>`).join('');
      $('#rl').oninput = e=>{
        const i = +e.target.dataset.ri;
        if(e.target.classList.contains('rq')) rollers[i].qty = e.target.value;
        else rollers[i].by = e.target.value;
        calc();
      };
      $('#rl').onchange = $('#rl').oninput;
    };
    const calc = ()=>{
      const used = num($('#q_full').value)*f.bpm + num($('#q_part').value) - num($('#q_ret').value);
      $('#used').innerHTML = `${fmt(used,1)} <span class="sm mut">กก.</span>`;
      const tq = rollers.reduce((s,r)=>s+num(r.qty),0);
      $('#tq').innerHTML = `${fmt(tq)} <span class="sm mut">ชิ้น</span>`;
      const full = Math.floor(tq / w.bpm), rest = tq - full*w.bpm;
      $('#bx').innerHTML = `${fmt(full)} <span class="sm mut">กล่องเต็ม</span>` +
        (rest ? ` <span class="sm mut">+ ${fmt(rest)} ชิ้น</span>` : '');
      // โชว์เทียบ "หลัง" กรอกครบเท่านั้น — ถ้าโชว์เลขที่ควรได้ก่อน คนจะพิมพ์ตามเลขนั้น
      if(used>0 && tq>0){
        const g = used*1000/tq;
        let cmp = '';
        if(std > 0){
          const exp = Math.round(used*1000/std);
          const d = tq - exp;
          cmp = d === 0
            ? ` <span class="diffz">· ตรงตามสูตรพอดี</span>`
            : ` <span class="${d<0?'diffneg':'diffpos'}">· ตามสูตร ${fmt(std)} ก./ชิ้น ควรได้ ${fmt(exp)} ชิ้น → ${d<0?'ขาด':'เกิน'} ${fmt(Math.abs(d))} ชิ้น</span>`;
        } else if(stats.length){
          const avg = stats.reduce((a,r)=>a+num(r.g_per_piece),0)/stats.length;
          const d = g - avg;
          cmp = Math.abs(d)/avg*100 < 10
            ? ` <span class="diffz">· พอ ๆ กับรอบก่อน (เฉลี่ย ${fmt(avg,1)})</span>`
            : ` <span class="${d>0?'diffpos':'diffneg'}">· ${d>0?'ใส่ไส้มากกว่า':'ใส่ไส้น้อยกว่า'}รอบก่อน ${fmt(Math.abs(d),1)} กรัม (เฉลี่ย ${fmt(avg,1)})</span>`;
        }
        $('#gpp').innerHTML = `<span class="mut">เฉลี่ยรอบนี้</span> <b>${fmt(g,1)}</b> <span class="mut">กรัม/ชิ้น · 1 กล่อง = ${fmt(w.bpm)} ชิ้น</span>${cmp}`;
      } else $('#gpp').innerHTML = '';
    };
    drawR(); calc();
    ['q_full','q_part','q_ret'].forEach(id => $('#'+id).oninput = calc);
    $('#gpp').addEventListener('refresh', calc);
    $('#addr').onclick = ()=>{ rollers.push({by:'',qty:''}); drawR(); calc(); };
  };

  app.innerHTML = header('ม้วน','โรงงาน', viewHome) + `<main>
    ${dateField('d')}
    <div class="fld"><label class="fl">ไส้ที่ม้วน</label>
      <select id="fv">${rolls.map(w=>`<option value="${w.id}">${esc(w.pname)}</option>`).join('')}</select></div>
    <div id="body"></div>
    <div class="note">ม้วนเสร็จ เข้ากล่อง แช่แข็งเลย · แป้งกับชีสระบบหักให้เองตามจำนวนที่ม้วนได้</div>
    <button class="btn" id="save">บันทึก</button>
  </main>`;
  wire(viewHome);
  $('#fv').onchange = ()=>{ rollers=[{by:'',qty:''}]; render(); };
  render();
  mountProd('roll');

  $('#save').onclick = async e=>{
    const w = item($('#fv').value), f = fill(w.pcode);
    const outs = rollers.filter(r=>num(r.qty)>0).map(r=>({item:w.id, by:r.by||null, qty:num(r.qty)}));
    if(!outs.length) return toast('ยังไม่ได้กรอกจำนวนที่ม้วนได้','bad');
    if(outs.some(o=>!o.by)) return toast('ต้องเลือกคนม้วนทุกบรรทัด','bad');
    const used = num($('#q_full').value)*f.bpm + num($('#q_part').value) - num($('#q_ret').value);
    if(used<=0) return toast('ยังไม่ได้กรอกไส้ที่เบิก','bad');
    busy(e.target,true);
    const { error } = await sb.rpc('fn_save_production',{
      p_kind:'roll', p_branch:S.loc.id, p_on:$('#d').value,
      p_input_item:f.id, p_input_full:num($('#q_full').value),
      p_input_partial:num($('#q_part').value), p_input_returned:num($('#q_ret').value),
      p_note:'', p_outputs:outs, p_inputs:[]
    });
    busy(e.target,false,'บันทึก');
    if(error) return toast(errMsg(error),'bad');
    done(`บันทึกม้วน ${fmt(outs.reduce((s,o)=>s+o.qty,0))} ชิ้นแล้ว`);
  };
}

/* ============================================================
   4 · ผสม / แบ่งบรรจุ
   กรอก "วัตถุดิบหลัก" ตัวเดียว ตัวอื่นคำนวณตามอัตราส่วน แก้ไม่ได้
   ============================================================ */
function scSauce(){
  const outs = S.M.items.filter(x => x.level==='packed' && (x.cat==='SAUCE' || x.cat==='TATER'));
  const mats = S.M.items.filter(x => x.level==='raw' && (x.cat==='SMAT' || x.cat==='TATER'));
  let rec = [], main = null, outUnit = 'หน่วย', gpb = 20;

  app.innerHTML = header('ผสม / แบ่งบรรจุ','โรงงาน', viewHome) + `<main>
    ${dateField('d')}
    <div class="fld"><label class="fl">ของที่ทำ</label>
      <select id="sv">${outs.map(r=>`<option value="${r.id}">${esc(r.label)}</option>`).join('')}</select></div>
    <div id="body"><div class="ldg sm">กำลังอ่านสูตร…</div></div>
    <button class="btn" id="save">บันทึก</button>
  </main>`;
  wire(viewHome);

  const load = async ()=>{
    $('#body').innerHTML = '<div class="ldg sm">กำลังอ่านสูตร…</div>';
    const { data, error } = await sb.rpc('fn_recipe', { p_output: $('#sv').value, p_as_of: $('#d').value });
    if(error){ $('#body').innerHTML = `<div class="note err">${esc(errMsg(error))}</div>`; return; }
    rec = data || [];
    main = rec.find(r => r.is_main) || rec[0] || null;
    const it = item($('#sv').value);
    outUnit = rec.length ? rec[0].out_unit : it.ub;
    gpb     = rec.length ? num(rec[0].g_per_base) : 20;
    draw();
  };

  const draw = ()=>{
    const it = item($('#sv').value);
    if(!rec.length){
      // ไม่มีสูตร (เช่น ครีมเดอโพรวองส์ ที่เจ้าของผสมเอง) -> กรอกเองทุกตัว
      $('#body').innerHTML = `
        <div class="note err">ตัวนี้ยังไม่ได้ใส่สูตร — กรอกวัตถุดิบที่ใช้จริงเองได้เลย</div>
        <div class="card"><h3>วัตถุดิบที่ใช้</h3><div class="lst" id="mt">
          ${mats.map(m=>`<div class="li" data-m="${m.id}">
            <div class="nm">${esc(m.label)}<small>คลังมี ${fmt(oh(m.id),2)} ${esc(m.ub)}</small></div>
            <input type="number" inputmode="decimal" min="0" step="any" class="mq" placeholder="0">
            <div class="u">${esc(m.ub)}</div></div>`).join('')}
        </div>
        <div class="tot"><span class="sm mut">น้ำหนักรวม</span><span class="big" id="tk">0 <span class="sm mut">กก.</span></span></div>
        </div>
        ${outBox(it)}`;
      $('#mt').oninput = calc; $('#got').oninput = calc; calc();
      return;
    }

    const others = rec.filter(r => r !== main);
    $('#body').innerHTML = `
      <div class="card"><h3>วัตถุดิบ</h3>
        <div class="xs mut" style="margin:-4px 0 10px">สูตร 1 ชุด = ${fmt(num(rec[0].batch_kg),3)} กก.
          → ${fmt(num(rec[0].batch_units))} ${esc(outUnit)} (${esc(outUnit)}ละ ${fmt(gpb)} กรัม)</div>

        <div class="li" style="border-top:1px solid var(--line)">
          <div class="nm">⭐ ${esc(main.label)}
            <small>สูตร ${fmt(num(main.qty_per_batch),3)} ${esc(main.unit_base)}/ชุด · คลังมี ${fmt(num(main.on_hand),2)}</small></div>
          <input type="number" inputmode="decimal" min="0" step="any" id="mainq"
                 value="${num(main.qty_per_batch)}" placeholder="0">
          <div class="u">${esc(main.unit_base)}</div>
        </div>
        <div class="xs mut" style="margin:4px 0 10px">กรอกเฉพาะตัวนี้ ตัวอื่นระบบปรับตามอัตราส่วนให้เอง</div>

        ${others.length ? `<div class="lst" id="oth">${others.map(r=>`
          <div class="li" data-o="${r.input_item_id}" data-per="${r.qty_per_batch}">
            <div class="nm">${esc(r.label)}<small>คลังมี ${fmt(num(r.on_hand),2)} ${esc(r.unit_base)}</small></div>
            <div class="v calcq" style="font-size:16px;font-weight:600;min-width:74px;text-align:right">0</div>
            <div class="u">${esc(r.unit_base)}</div>
          </div>`).join('')}</div>` : ''}

        <div class="tot"><span class="sm mut">รวม <span id="nb"></span></span>
          <span class="big" id="tk">0 <span class="sm mut">กก.</span></span></div>
      </div>
      ${outBox(it)}`;
    $('#mainq').oninput = calc;
    $('#got').oninput = calc;
    calc();
  };

  const outBox = it => `
    <div class="card"><h3>บรรจุได้กี่${esc(outUnit)}</h3>
      <input id="got" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
      <div class="tot" style="margin-top:12px">
        <span class="sm mut">ควรได้จากน้ำหนักที่ใช้</span>
        <span class="big" id="should">0 <span class="sm mut">${esc(outUnit)}</span></span></div>
      <div id="cmp" class="xs" style="margin-top:8px"></div>
    </div>`;

  const calc = ()=>{
    let kg = 0;
    if(rec.length && main){
      const mq = num($('#mainq').value);
      const f  = num(main.qty_per_batch) > 0 ? mq / num(main.qty_per_batch) : 0;
      kg = mq;
      document.querySelectorAll('#oth .li[data-o]').forEach(li=>{
        const q = num(li.dataset.per) * f;
        li.querySelector('.calcq').textContent = fmt(q, 3);
        li.style.opacity = q > 0 ? 1 : .55;
        kg += q;
      });
      $('#nb').textContent = f ? `(= ${fmt(f,2)} ชุด)` : '';
    } else {
      document.querySelectorAll('#mt .li[data-m]').forEach(li=>{ kg += num(li.querySelector('.mq').value); });
    }
    $('#tk').innerHTML = `${fmt(kg,3)} <span class="sm mut">กก.</span>`;
    const should = Math.floor(kg * 1000 / gpb);
    $('#should').innerHTML = `${fmt(should)} <span class="sm mut">${esc(outUnit)}</span>`;
    const got = num($('#got').value), d = got - should;
    $('#cmp').innerHTML = (!got || !should) ? '' :
      (d === 0 ? '<span class="diffz">ตรงพอดี 👍</span>'
       : `<span class="${d<0?'diffneg':'diffpos'}">${d>0?'ได้เกิน':'ได้ขาด'} ${fmt(Math.abs(d))} ${esc(outUnit)}</span>
          <span class="mut"> — ${d<0?`ของหก เหลือเศษ หรือใส่เกิน ${fmt(gpb)} กรัม` : `ใส่น้อยกว่า ${fmt(gpb)} กรัม/${esc(outUnit)}`}</span>`);
  };

  $('#sv').onchange = load;
  $('#d').onchange  = load;
  load();
  mountProd('sauce_fill');

  $('#save').onclick = async e=>{
    const sid = $('#sv').value;
    let inputs = [];
    if(rec.length && main){
      const mq = num($('#mainq').value);
      if(mq <= 0) return toast('ยังไม่ได้กรอกวัตถุดิบหลัก','bad');
      const f = mq / num(main.qty_per_batch);
      inputs.push({ item: main.input_item_id, qty: mq });
      rec.filter(r=>r!==main).forEach(r=>{
        const q = Math.round(num(r.qty_per_batch) * f * 1000) / 1000;
        if(q > 0) inputs.push({ item: r.input_item_id, qty: q });
      });
    } else {
      inputs = [...document.querySelectorAll('#mt .li[data-m]')]
        .map(li=>({ item: li.dataset.m, qty: num(li.querySelector('.mq').value) }))
        .filter(r=>r.qty > 0);
      if(!inputs.length) return toast('ยังไม่ได้กรอกวัตถุดิบที่ใช้','bad');
    }
    const got = num($('#got').value);
    if(got <= 0) return toast(`ยังไม่ได้กรอกจำนวน${outUnit}ที่ได้`,'bad');
    busy(e.target,true);
    const { error } = await sb.rpc('fn_save_production',{
      p_kind:'sauce_fill', p_branch:S.loc.id, p_on:$('#d').value,
      p_input_item:null, p_input_full:0, p_input_partial:0, p_input_returned:0,
      p_note:'', p_outputs:[{item:sid, qty:got}], p_inputs:inputs
    });
    busy(e.target,false,'บันทึก');
    if(error) return toast(errMsg(error),'bad');
    done(`บรรจุ ${fmt(got)} ${outUnit}แล้ว`);
  };
}

/* ============================================================
   5 · จัดของส่งสาขา  /  ส่งของไปสาขาอื่น
   ============================================================ */
function scShip(){ transferView(true); }
function scB2B(){ transferView(false); }

function transferView(fromFactory){
  // โรงงานส่งออกไปสาขา · สาขาส่งไปสาขาอื่น "หรือส่งคืนโรงงาน" ได้
  const dests = fromFactory
    ? S.M.branches.filter(b=>b.id!==S.loc.id && b.kind!=='factory')
    : S.M.branches.filter(b=>b.id!==S.loc.id);
  if(!dests.length){ toast('ไม่มีปลายทางให้ส่ง','bad'); return viewHome(); }
  const title = fromFactory ? 'จัดของส่งสาขา' : 'ส่งของไปที่อื่น';
  app.innerHTML = header(title, S.loc.name, viewHome) + `<main>
    ${dateField('d')}
    <div class="fld"><label class="fl">ส่งไปที่</label>
      <select id="to">${dests.map(b=>`<option value="${b.id}">${b.kind==='factory'?'🏭 ':''}${esc(b.name)}</option>`).join('')}</select></div>
    ${fromFactory?'<div class="note">ช่องจำนวน<b>ว่างไว้ให้กรอกเอง</b> · ดู <b>"แนะนำ"</b> ใต้ชื่อของ แล้วใส่ตามที่หยิบใส่จริง<br>ของที่ไม่ส่ง เว้นว่างได้ · ส่งไม่เต็มกล่อง ใส่เศษในช่องหลัง +</div>':''}
    <div class="fld"><label class="fl">เหตุผล${fromFactory?' (ไม่บังคับ)':''}</label><input id="rs" placeholder="${fromFactory?'ส่งประจำวัน':'เช่น ของหมดกะทันหัน'}"></div>
    <div id="plan"><div class="ldg sm">กำลังคิดให้…</div></div>
    <button class="btn" id="save">ออกใบส่งของ</button>
    <div id="outb" style="margin-top:22px"></div>
  </main>`;
  wire(viewHome);

  const drawPlan = async ()=>{
    const to = $('#to').value;
    $('#plan').innerHTML = '<div class="ldg sm">กำลังคิดให้…</div>';
    let rows = [];
    if(fromFactory){
      const { data, error } = await sb.rpc('fn_delivery_plan',{ p_branch:to, p_as_of:$('#d').value });
      if(error){ $('#plan').innerHTML = `<div class="note err">${esc(errMsg(error))}</div>`; return; }
      rows = (data||[]).map(r=>({ id:r.stock_item_id, label:r.label, cat:r.category,
        ub:r.unit_base, um:r.unit_major, bpm:num(r.base_per_major),
        share:r.share_pct, target:num(r.target_base), there:num(r.on_hand_base),
        sendMajor: r.send_major==null?null:num(r.send_major), sendBase:num(r.send_base) }));
    }else{
      rows = S.M.items.filter(x=>x.level==='packed' && oh(x.id)>0)
        .map(x=>({ id:x.id, label:x.label, cat:x.catname, ub:x.ub, um:x.um, bpm:x.bpm,
          share:null, target:null, there:null, sendMajor:x.bpm>1?0:null, sendBase:0 }));
      if(!rows.length){ $('#plan').innerHTML = '<div class="note">ที่นี่ยังไม่มีของให้ส่ง</div>'; return; }
    }
    let html = '', cat = '', rwMap = new Map();
    if(fromFactory){
      try{
        const fs = await sb.rpc('fn_supply_status',{ p_branch: to });
        const bad = (fs.data||[]).filter(r=>r.status!=='ok').sort((a,b)=>a.sort_order-b.sort_order);
        if(bad.length) html += `<div class="note err" style="margin-top:10px">🧴 สาขาแจ้งของใช้: ${
          bad.map(r=>`<b>${esc(r.label)}</b> ${r.status==='out'?'หมด':'ใกล้หมด'}`).join(' · ')}</div>`;
      }catch(e){}
      rwMap = new Map();
      const rw = (await loadRunway()).filter(x=>x.branch_id===to);
      rw.forEach(x=>rwMap.set(x.stock_item_id, x));
      const hot = rwHot(rw);
      if(hot.length) html += `<div class="note err" id="rwhot" style="margin-top:10px">🚨 <b>อาจหมดก่อนรอบส่งหน้า (${dnext(hot[0].next_delivery)})</b><br>${
        hot.map(rwLine).join('<br>')}<div class="xs" style="margin-top:6px">คิดจาก: ที่สาขาเหลือ (นับ ${ddmm(hot[0].counted_on)}) ÷ ขายเฉลี่ยต่อวันจาก POS</div></div>`;
    }
    for(const r of rows){
      if(r.cat!==cat){ cat=r.cat; html += `<div class="card" style="padding:12px 14px;margin:14px 0 8px"><h3 style="margin:0">${esc(cat)}</h3></div>`; }
      const byMajor = r.bpm>1;
      const have = oh(r.id);
      // เลขแนะนำโชว์ให้ดู แต่ไม่กรอกให้ — คนจัดของต้องพิมพ์เองทุกครั้ง (เจ้าของสั่ง 25 ก.ย.)
      const sugQ = byMajor ? num(r.sendMajor) : num(r.sendBase);
      const sug = fromFactory && sugQ > 0;
      html += `<div class="li" data-row="${r.id}" data-bpm="${r.bpm}" data-major="${byMajor?1:0}"${sug?' data-sug="1"':''}>
        <div class="nm">${esc(r.label)}
          <small>${sug ? `<b class="sug">แนะนำ ${fmt(sugQ)} ${esc(byMajor?r.um:r.ub)}</b> · ` : ''}ที่นี่มี ${esc(boxTxt(have, r.bpm, r.um, r.ub))}${
            r.share!=null?` · สาขาขายได้ ${r.share}%`:''}${
            rwMap.has(r.id) ? ' · ' + rwNote(rwMap.get(r.id)) : ''}${
            r.cat==='ของใช้' && r.there!=null ? ` · สาขามี ${esc(boxTxt(r.there, r.bpm, r.um, r.ub))}` : ''}</small></div>
        <input type="number" inputmode="numeric" min="0" step="1" class="qs" placeholder=" "
          value="" style="width:${byMajor?58:72}px">
        <div class="u">${esc(byMajor?r.um:r.ub)}</div>
        ${byMajor?`<span class="plus">+</span>
        <input type="number" inputmode="numeric" min="0" step="1" class="qr" placeholder="0" style="width:58px">
        <div class="u">${esc(r.ub)}</div>`:''}
      </div>`;
    }
    $('#plan').innerHTML = html;
    $('#plan').oninput = e=>{ const li = e.target.closest('.li.miss'); if(li && e.target.value!=='') li.classList.remove('miss'); tally(); };
    tally();
  };
  const tally = ()=>{
    let short = [];
    document.querySelectorAll('#plan .li[data-row]').forEach(li=>{
      const bpm = num(li.dataset.bpm), byM = li.dataset.major==='1';
      const rq = li.querySelector('.qr');
      const q = num(li.querySelector('.qs').value) * (byM?bpm:1) + (rq?num(rq.value):0);
      const have = oh(li.dataset.row);
      li.style.opacity = (q>0 || li.dataset.sug) ? 1 : .55;
      li.querySelector('.qs').style.borderColor = q>have ? 'var(--bad)' : '';
      if(rq) rq.style.borderColor = q>have ? 'var(--bad)' : '';
      if(q>have) short.push(li.querySelector('.nm').childNodes[0].textContent.trim());
    });
    const w = $('#warn');
    if(w) w.remove();
    if(short.length){
      const d = document.createElement('div');
      d.id='warn'; d.className='note err'; d.style.marginTop='12px';
      d.textContent = 'ของไม่พอ: '+short.join(', ')+' — ส่วนที่ขาดจะถูกบันทึกเป็น "ค้างส่ง"';
      $('#plan').appendChild(d);
    }
  };
  const drawOut = ()=> loadOutbound($('#d').value);
  $('#to').onchange = drawPlan;
  $('#d').onchange = ()=>{ drawPlan(); drawOut(); };
  drawPlan(); drawOut();

  $('#save').onclick = async e=>{
    const lines = [], slip = [];
    document.querySelectorAll('#plan .li[data-row]').forEach(li=>{
      const bpm = num(li.dataset.bpm), byM = li.dataset.major==='1';
      const rq = li.querySelector('.qr');
      const want = num(li.querySelector('.qs').value) * (byM?bpm:1) + (rq?num(rq.value):0);
      if(want<=0) return;
      const have = oh(li.dataset.row);
      const sent = Math.min(want, have);
      lines.push({ item: li.dataset.row, sent, short: Math.max(0, want-sent) });
      const it = item(li.dataset.row) || {};
      slip.push({ label: it.label || li.querySelector('.nm').childNodes[0].textContent.trim(), cat: it.catname || '',
                  bpm, um: it.um || '', ub: it.ub || '', sent, short: Math.max(0, want-sent) });
    });
    if(!lines.length) return toast('ยังไม่ได้ใส่จำนวน','bad');
    if(!fromFactory && !$('#rs').value.trim()) return toast('ส่งของออกจากสาขา ต้องใส่เหตุผล','bad');
    busy(e.target,true);
    const { data, error } = await sb.rpc('fn_save_transfer',{
      p_from:S.loc.id, p_to:$('#to').value, p_on:$('#d').value,
      p_reason:$('#rs').value, p_photo:'', p_lines:lines
    });
    busy(e.target,false,'ออกใบส่งของ');
    if(error) return toast(errMsg(error),'bad');
    const doc = (data && data[0] && data[0].doc_no) || '';
    toast(`ออกใบส่งของ ${doc} แล้ว · ${lines.length} รายการ`,'ok');
    const toName = $('#to').selectedOptions[0].textContent.replace('🏭 ','').trim();
    await loadOnHand(S.loc.id);
    drawPlan(); drawOut();
    shareSlip(slipText({ doc, from: S.loc.name, to: toName, on: $('#d').value, by: S.me.nickname, lines: slip }), doc);
  };
}

/* ---------- ใบส่งของ → ส่งใน LINE (เจ้าของสั่ง 25 ก.ย.: มีจำนวน · สาขาเช็กว่าได้ครบไหม) ---------- */
function slipText(s){
  const d = s.on ? new Date(s.on+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}) : '';
  let t = `📦 ใบส่งของ ${s.doc}\n${s.from} → ${s.to}\n${d} · ออกโดย ${s.by}\n`;
  if(s.lines){
    let cat = null;
    s.lines.forEach(l=>{
      if(l.cat !== cat){ cat = l.cat; t += `\n${cat}\n`; }
      t += `• ${l.label}  ${boxTxt(l.sent, l.bpm, l.um, l.ub)}\n`;
    });
    const sh = s.lines.filter(l=>l.short>0);
    if(sh.length) t += `\n⚠️ ค้างส่ง (ของไม่พอ): ${sh.map(l=>`${l.label} ${boxTxt(l.short, l.bpm, l.um, l.ub)}`).join(' · ')}\n`;
    t += `\nรวม ${s.lines.length} รายการ\n`;
  } else if(s.summary){
    t += `\n${s.summary}\n`;
  }
  t += `\n👉 ของถึงแล้ว เปิดแอป กด "รับของ" แล้วเช็กทีละรายการว่าได้ครบไหม`;
  return t;
}
function shareSlip(text, doc){
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox">
    <h3 style="margin:0 0 6px">ส่งใบ ${esc(doc)} ใน LINE</h3>
    <pre class="slip" style="white-space:pre-wrap;font-family:inherit;font-size:13.5px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:46vh;overflow:auto;margin:0 0 12px">${esc(text)}</pre>
    <a class="btn" id="sl" style="background:#06C755;text-align:center;text-decoration:none" target="_blank" rel="noopener"
       href="https://line.me/R/share?text=${encodeURIComponent(text)}">ส่งใน LINE</a>
    <button class="btn gh sm2" id="sc" style="margin-top:8px">คัดลอกข้อความ</button>
    <button class="btn gh sm2" id="sx" style="margin-top:8px">ปิด</button>
  </div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  wrap.onclick = e => { if(e.target===wrap) close(); };
  wrap.querySelector('#sx').onclick = close;
  wrap.querySelector('#sc').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(text); toast('คัดลอกแล้ว · ไปวางในแชท LINE ได้เลย','ok'); }
    catch(e){ toast('คัดลอกไม่ได้ · กดค้างที่ข้อความแล้วเลือกคัดลอก','bad'); }
  };
}

/* ---------- ใบที่ออกไปวันนี้ · กดยกเลิกได้ถ้าปลายทางยังไม่รับ ---------- */
async function loadOutbound(on){
  const box = $('#outb'); if(!box) return;
  box.innerHTML = '<div class="ldg sm">กำลังโหลดใบที่ออกไป…</div>';
  const { data, error } = await sb.rpc('fn_outbound', { p_branch:S.loc.id, p_on:on });
  if(error){ box.innerHTML = `<div class="note err">${esc(errMsg(error))}</div>`; return; }
  const rows = data || [];
  if(!rows.length){ box.innerHTML = '<div class="xs mut">ยังไม่มีใบส่งของออกจากที่นี่ในวันนี้</div>'; return; }
  const hhmm = t => t ? new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}) : '';
  box.innerHTML = `<div class="card"><h3>ใบที่ออกไปวันนี้ (${rows.length})</h3>
    ${rows.map(r=>`<div class="ck ${r.voided_at?'no':''}" style="align-items:flex-start">
      <div class="mk">${r.voided_at?'🚫':(r.received_at?'✅':'📦')}</div>
      <div class="bd">
        <b style="${r.voided_at?'text-decoration:line-through;opacity:.6':''}">${esc(r.doc_no)} → ${esc(r.to_name)}</b>
        <span style="white-space:pre-line">${esc(r.summary||'')}</span>
        <span class="xs mut">${r.voided_at
          ? `ยกเลิกแล้ว ${hhmm(r.voided_at)} · ${esc(r.void_reason||'')}`
          : r.received_at ? `ปลายทางรับแล้ว ${hhmm(r.received_at)} · ยกเลิกไม่ได้`
          : `ออกโดย ${esc(r.issued_by||'')} · ยังไม่มีใครรับ`}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
      ${!r.voided_at?`<button class="btn sm2" style="width:auto;padding:8px 12px;background:#06C755" data-share="${r.id}">ส่ง LINE</button>`:''}
      ${r.can_void?`<button class="btn gh sm2" style="width:auto;padding:8px 12px" data-void="${r.id}" data-doc="${esc(r.doc_no)}">ยกเลิก</button>`:''}
      </div>
    </div>`).join('')}
    <div class="xs mut" style="margin-top:8px">ยกเลิกแล้วของกลับเข้าสต๊อกที่นี่ทันที · ใบเก่ายังเก็บไว้ ไม่ได้ลบทิ้ง</div>
  </div>`;
  box.onclick = e => {
    const sh = e.target.closest('[data-share]');
    if(sh){ const r = rows.find(x=>x.id===sh.dataset.share);
      return shareSlip(slipText({ doc:r.doc_no, from:S.loc.name, to:r.to_name, on:r.issued_on, by:r.issued_by||'', summary:r.summary||'' }), r.doc_no); }
    const b = e.target.closest('[data-void]'); if(!b) return;
    askVoid(b.dataset.void, b.dataset.doc, on);
  };
}

        <div class="rx" style="flex-basis:100%;display:none;align-items:center;gap:8px;justify-content:flex-end;margin-top:8px">
          <span class="sm mut">ได้จริง</span>
          ${byM?`<input type="number" inputmode="numeric" step="1" min="0" class="rM" placeholder=" " style="width:58px">
          <div class="u">${esc(l.major||'')}</div><span class="plus">+</span>`:''}
          <input type="number" inputmode="decimal" step="any" min="0" class="rq" placeholder=" " style="width:${byM?58:72}px">
          <div class="u">${esc(l.unit)}</div>
        </div>
      </div>`;}).join('')}
    </div></div>
    <button class="btn" id="save">ยืนยันรับของ</button>
  </main>`;
  wire(scRecv);
  app.querySelector('main').addEventListener('click', e=>{
    const b = e.target.closest('.tri button'); if(!b) return;
    const li = b.closest('.li[data-line]'); li.dataset.v = b.dataset.v; li.classList.remove('miss');
    li.querySelectorAll('.tri button').forEach(x=>x.classList.toggle('on', x===b));
    const rx = li.querySelector('.rx'); rx.style.display = b.dataset.v==='out' ? 'flex' : 'none';
    if(b.dataset.v==='out') setTimeout(()=>{ const i = rx.querySelector('input'); if(i) i.focus(); }, 50);
  });
  app.querySelector('main').addEventListener('input', e=>{ const li = e.target.closest('.li.miss'); if(li) li.classList.remove('miss'); });
  $('#save').onclick = async e=>{
    const all = [...document.querySelectorAll('.li[data-line]')];
    all.forEach(li=>li.classList.remove('miss'));
    // ทุกรายการต้องเช็ก: ครบ หรือ ไม่ครบ + ใส่จำนวนจริง
    const bad = all.filter(li=> !li.dataset.v || (li.dataset.v==='out' &&
      [...li.querySelectorAll('.rx input')].every(i=>i.value==='')));
    if(bad.length){
      bad.forEach(li=>li.classList.add('miss'));
      bad[0].scrollIntoView({block:'center', behavior:'smooth'});
      return toast(`ยังไม่ได้เช็ก ${bad.length} รายการ · กด ครบ หรือ ไม่ครบ (ไม่ครบต้องใส่จำนวนที่ได้จริง)`,'bad');
    }
    const lines = all.map(li=>{
      const bpm = num(li.dataset.bpm), mEl = li.querySelector('.rM');
      return { line: li.dataset.line,
               received: li.dataset.v==='ok' ? num(li.dataset.sent)
                 : (mEl?num(mEl.value)*bpm:0) + num(li.querySelector('.rq').value) };
    });
    busy(e.target,true);
    const { error } = await sb.rpc('fn_receive_transfer',{ p_transfer:t.id, p_lines:lines });
    busy(e.target,false,'ยืนยันรับของ');
    if(error) return toast(errMsg(error),'bad');
    done('รับของ '+t.doc_no+' แล้ว');
  };
}

/* ============================================================
   7b · ของเข้าโรงงาน — ซื้อเข้า หรือเจ้าของทำเองมาส่ง
   ============================================================ */
function scIn(){
  const its = S.M.items.filter(x=> x.level==='raw' || x.level==='filling' || x.level==='packed');
  const order = ['raw','filling','packed'];
  const levTh = {raw:'วัตถุดิบ', filling:'ไส้ (กก.)', packed:'ของพร้อมขาย'};
  let html = '';
  for(const lv of order){
    const g = its.filter(x=>x.level===lv);
    if(!g.length) continue;
    html += `<div class="card"><h3>${esc(levTh[lv])}</h3><div class="lst">`;
    for(const x of g){
      const byM = x.bpm>1;
      html += `<div class="li" data-item="${x.id}" data-bpm="${x.bpm}">
        <div class="nm">${esc(x.label)}${byM?`<small>1 ${esc(x.um)} = ${fmt(x.bpm)} ${esc(x.ub)}</small>`:''}</div>
        ${byM?`<input type="number" inputmode="numeric" min="0" step="1" class="cM" placeholder="0" style="width:72px">
               <div class="u">${esc(x.um)}</div>`:''}
        <input type="number" inputmode="decimal" min="0" step="any" class="cm" placeholder="0" style="width:72px">
        <div class="u">${esc(x.ub)}</div>
      </div>`;
    }
    html += `</div></div>`;
  }
  app.innerHTML = header('ของเข้าโรงงาน', S.loc.name, viewHome) + `<main>
    <div class="note">ของที่เข้ามาโดยไม่ได้มาจากใบส่งของ — ซื้อวัตถุดิบเข้า หรือเจ้าของผสมเองมาส่ง
    · กรอกเฉพาะรายการที่เข้ามาจริงวันนี้ ที่เหลือเว้นว่างไว้</div>
    ${dateField('d')}
    <div class="fld"><label class="fl">ของมาจากไหน</label>
      <select id="kd">
        <option value="buy">ซื้อเข้า</option>
        <option value="made">เจ้าของทำเองมาส่ง</option>
        <option value="other">อื่น ๆ</option>
      </select></div>
    <div class="fld"><label class="fl">ซื้อจากใคร / ใครทำ</label><input id="src" placeholder="เช่น ร้านเจ๊หมวย · จิ้นทำเอง"></div>
    ${html}
    <div class="fld"><label class="fl">หมายเหตุ (ไม่บังคับ)</label><input id="nt"></div>
    <button class="btn" id="save">บันทึกของเข้า</button>
    <div id="rcpt" style="margin-top:22px"></div>
  </main>`;
  wire(viewHome);
  const drawR = ()=> loadReceipts($('#d').value);
  $('#d').onchange = drawR;
  drawR();

  $('#save').onclick = async e=>{
    const lines = [];
    document.querySelectorAll('.li[data-item]').forEach(li=>{
      const bpm = num(li.dataset.bpm);
      const M = li.querySelector('.cM') ? num(li.querySelector('.cM').value) : 0;
      const m = num(li.querySelector('.cm').value);
      const q = M*bpm + m;
      if(q>0) lines.push({ item: li.dataset.item, qty: q });
    });
    if(!lines.length) return toast('ยังไม่ได้ใส่จำนวนสักรายการ','bad');
    busy(e.target,true);
    const { error } = await sb.rpc('fn_save_receipt',{
      p_branch:S.loc.id, p_on:$('#d').value, p_kind:$('#kd').value,
      p_source:$('#src').value, p_note:$('#nt').value, p_lines:lines
    });
    busy(e.target,false,'บันทึกของเข้า');
    if(error) return toast(errMsg(error),'bad');
    document.querySelectorAll('.li[data-item] input').forEach(i=>i.value='');
    $('#src').value=''; $('#nt').value='';
    toast(`บันทึกของเข้า ${lines.length} รายการแล้ว`,'ok');
    await loadOnHand(S.loc.id);
    drawR();
  };
}

async function loadReceipts(on){
  const box = $('#rcpt'); if(!box) return;
  box.innerHTML = '<div class="ldg sm">กำลังโหลด…</div>';
  const { data, error } = await sb.rpc('fn_receipts', { p_branch:S.loc.id, p_on:on });
  if(error){ box.innerHTML = `<div class="note err">${esc(errMsg(error))}</div>`; return; }
  const rows = data || [];
  if(!rows.length){ box.innerHTML = '<div class="xs mut">ยังไม่มีของเข้าในวันนี้</div>'; return; }
  const kindTh = {buy:'🛒 ซื้อเข้า', made:'👨‍🍳 เจ้าของทำเอง', other:'📥 อื่น ๆ'};
  const hhmm = t => t ? new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}) : '';
  box.innerHTML = `<div class="card"><h3>ของเข้าวันนี้ (${rows.length})</h3>
    ${rows.map(r=>`<div class="ck" style="align-items:flex-start">
      <div class="mk">✅</div>
      <div class="bd"><b>${kindTh[r.kind]||''}${r.source?' · '+esc(r.source):''}</b>
        <span style="white-space:pre-line">${esc(r.summary||'')}</span>
        <span class="xs mut">${esc(r.by_name||'')} · ${hhmm(r.at_time)}${r.note?' · '+esc(r.note):''}</span></div>
    </div>`).join('')}
  </div>`;
}

/* ---------- ของใช้: นับเฉพาะแพ็กที่ยังไม่เปิด · น้ำมัน/ผงชา = ชั่ง ---------- */
// น้ำมัน: ตัวเลขชั่งจริงจากเจ้าของ (stock.settings) · ลิตร = (กก. − แกลลอนเปล่า) × ลิตรต่อแกลลอน ÷ น้ำหนักน้ำมันเต็มแกลลอน
function oilL(kg){
  const tare = num(S.set.oil_tare_kg), net = num(S.set.oil_net_kg), lpg = num(S.set.oil_l_per_gal) || 13.75;
  if(!net) return null;
  return Math.max(num(kg) - tare, 0) * lpg / net;
}
// แสดงจำนวนของใช้เป็นหน่วยที่คนนับจริง: แพ็ก/แถว (+ เศษ) · น้ำมัน = ลิตร · ผงชา = กก.
function supQty(label, base){
  const it = S.M.items.find(x=>x.label===label) || {};
  const v = num(base), bpm = num(it.bpm) || 1;
  if(it.pcode==='SUP_OIL') return { n: fmt(v,1), u: 'ลิตร' };
  if(it.ub==='กก.') return { n: fmt(v,2), u: 'กก.' };
  if(bpm > 1){
    const M = Math.trunc(v / bpm), r = Math.round((v - M*bpm)*100)/100;
    return { n: fmt(M), u: it.um || '', r: r ? `+${fmt(r)} ${it.ub||''}` : '' };
  }
  return { n: fmt(v), u: it.ub || '' };
}
function supRow(x){
  if(x.pcode==='SUP_OIL'){
    return `<div class="li" data-item="${x.id}" data-bpm="${x.bpm}" data-oil="1" style="flex-wrap:wrap">
      <div class="nm">${esc(x.label)}<small>แกลลอนที่ยังไม่เปิด</small></div>
      <input type="number" inputmode="numeric" min="0" step="1" class="cM" placeholder=" " style="width:72px">
      <div class="u">${esc(x.um||'แกลลอน')}</div>
      <div style="flex-basis:100%;display:flex;align-items:center;gap:10px">
        <div class="nm" style="font-size:13.5px">แกลลอนที่เปิดอยู่<small>แขวนชั่งทั้งแกลลอน · ไม่มีแกลลอนที่เปิดอยู่ ใส่ 0</small></div>
        <input type="number" inputmode="decimal" min="0" step="0.01" class="ckg" placeholder=" " style="width:72px">
        <div class="u">กก.</div>
      </div>
      <div class="xs oilp" style="flex-basis:100%;text-align:right;min-height:0"></div>
    </div>`;
  }
  const byM = x.bpm>1;
  const dec = x.ub==='กก.';
  return `<div class="li" data-item="${x.id}" data-bpm="${x.bpm}" data-sup="1">
    <div class="nm">${esc(x.label)}${byM?`<small>1 ${esc(x.um)} = ${fmt(x.bpm)} ${esc(x.ub)}</small>`
      : dec ? `<small>ชั่งรวมทั้งหมดที่เหลือ</small>` : ''}</div>
    <input type="number" inputmode="${dec?'decimal':'numeric'}" min="0" step="${dec?'0.01':'1'}" class="${byM?'cM':'cm'}" placeholder=" " style="width:72px">
    <div class="u">${esc(byM ? x.um : x.ub)}</div>
  </div>`;
}
function oilPreview(li){
  const kgI = li.querySelector('.ckg'), out = li.querySelector('.oilp');
  if(!kgI || !out) return;
  const kg = kgI.value === '' ? null : num(kgI.value);
  const tare = num(S.set.oil_tare_kg), net = num(S.set.oil_net_kg);
  if(kg === null){ out.innerHTML = ''; return; }
  if(kg === 0){ out.innerHTML = '<span class="mut">ไม่มีแกลลอนที่เปิดอยู่</span>'; return; }
  if(kg > 0 && kg < tare){ out.innerHTML = `<span class="diffneg">เบากว่าแกลลอนเปล่า (${fmt(tare,1)} กก.) — ชั่งใหม่อีกที</span>`; return; }
  if(net && kg > tare + net + 0.5){ out.innerHTML = `<span class="diffneg">หนักกว่าแกลลอนเต็ม (${fmt(tare+net,1)} กก.) — ชั่งใหม่อีกที</span>`; return; }
  const l = oilL(kg);
  out.innerHTML = l === null ? '' : `<span class="mut">= น้ำมันในแกลลอนนี้</span> <b>${fmt(l,1)} ลิตร</b>`;
}

// ของใช้ที่ยังไม่มีในรายการ → เพิ่มเป็นของใช้ตัวจริง (นับจำนวนจริง · ทุกที่นับทุกวันตั้งแต่ครั้งหน้า)
const itemHere = (x, bid) => !x.locs || x.locs.includes(bid);
// เพิ่มรายการที่ยังไม่มี: ของใช้ (ทุกที่) · วัตถุดิบ (เฉพาะโรงงาน) → ขึ้นให้นับเฉพาะที่ที่เพิ่ม · ชื่อซ้ำ = ตัวเดิม
const SUP_UNITS = ['แพ็ก','ห่อ','ชิ้น','ขวด','กล่อง','ม้วน','ถุง','แกลลอน','กก.'];
const RAW_UNITS = ['กก.','ลิตร','ขวด','ถุง','แพ็ก','กล่อง','กระป๋อง','แผ่น','ชิ้น','ฟอง'];
function addSupBox(k){
  const raw = k==='raw';
  return `<button type="button" class="btn gh sm2" data-addopen="${k}" style="margin-top:10px">+ เพิ่ม${raw?'วัตถุดิบ':'ของใช้'}ที่ยังไม่มีในรายการ</button>
    <div data-addbox="${k}" style="display:none;margin-top:10px">
      <div class="xs mut" style="margin-bottom:6px">พิมพ์ชื่อ + หน่วยที่นับ${raw?' + หมวด':''} → กด "เพิ่ม" แล้วกรอกจำนวนในช่องที่ขึ้นมา · ขึ้นให้นับ<b>เฉพาะ${esc(S.loc.name)}</b></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input class="aN" placeholder="${raw?'ชื่อวัตถุดิบ เช่น เนยจืด':'ชื่อของ เช่น ถุงมือยาง'}" maxlength="60" style="flex:1;min-width:140px;width:auto;font-size:15px;text-align:left">
        <input class="aU" list="aUL_${k}" placeholder="หน่วย" maxlength="12" style="width:78px;font-size:15px;text-align:left">
        <datalist id="aUL_${k}">${(raw?RAW_UNITS:SUP_UNITS).map(u=>`<option value="${esc(u)}">`).join('')}</datalist>
        ${raw?`<select class="aC" style="width:auto;font-size:14px"><option value="MAT">วัตถุดิบ</option><option value="SMAT">วัตถุดิบซอส</option></select>`:''}
        <button type="button" class="btn sm2" data-addok="${k}" style="width:auto;padding:10px 14px">เพิ่ม</button>
      </div></div>`;
}
async function addSupply(btn){
  const k = btn.dataset.addok, raw = k==='raw', box = btn.closest('[data-addbox]');
  const name = box.querySelector('.aN').value.trim(), unit = box.querySelector('.aU').value.trim();
  const catc = raw ? box.querySelector('.aC').value : 'SUPPLY';
  if(!name) return toast('พิมพ์ชื่อก่อน','bad');
  if(!unit) return toast(raw ? 'ใส่หน่วยก่อน เช่น กก. ลิตร ขวด' : 'ใส่หน่วยก่อน เช่น แพ็ก ห่อ ชิ้น','bad');
  const nz = t => String(t||'').replace(/\s+/g,'').toLowerCase();
  const goRow = id => { const li = document.querySelector(`.li[data-item="${id}"]`); if(!li) return false;
    li.scrollIntoView({block:'center', behavior:'smooth'}); const i = li.querySelector('input'); if(i) setTimeout(()=>i.focus({preventScroll:true}),350); return true; };
  const same = it => raw ? it.level==='raw' : it.cat==='SUPPLY';
  const have = S.M.items.find(it=>same(it) && itemHere(it, S.loc.id) && (nz(it.label)===nz(name) || nz(it.pname)===nz(name)));
  if(have && goRow(have.id)) return toast(`"${have.label}" มีช่องนับอยู่แล้ว — กรอกตรงนี้`,'bad');
  busy(btn,true);
  const { data, error } = await sb.rpc('fn_add_item', { p_label:name, p_unit:unit, p_branch:S.loc.id, p_cat:catc });
  busy(btn,false,'เพิ่ม');
  if(error) return toast(errMsg(error),'bad');
  const r = (data||[])[0]; if(!r) return toast('เพิ่มไม่สำเร็จ','bad');
  let x = S.M.items.find(y=>y.id===r.stock_item_id);
  if(!x){
    const sib = S.M.items.filter(y=>y.cat===r.cat), base = sib[0] || S.M.items.find(same) || {};
    x = { id:r.stock_item_id, level:r.level, label:r.label, ub:r.unit_base, um:null, fac:raw,
      pcode:r.product_code, pname:r.product_name, psort:Math.max(0,...sib.map(y=>y.psort||0))+1, cat:r.cat, chilled:false,
      catname:base.catname||(raw?'วัตถุดิบ':'ของใช้'), csort:base.csort||0, bpm:1, locs:[S.loc.id] };
    S.M.items.push(x);
  } else if(x.locs && !x.locs.includes(S.loc.id)) x.locs.push(S.loc.id);
  if(!document.querySelector(`.li[data-item="${x.id}"]`)) $(raw ? '#rawl' : '#supl').insertAdjacentHTML('beforeend', raw ? countRow(x) : supRow(x));
  goRow(x.id);
  box.querySelector('.aN').value = ''; box.querySelector('.aU').value = '';
  toast(r.existed ? `"${r.label}" มีอยู่แล้ว — กรอกจำนวนได้เลย` : `เพิ่ม "${r.label}" แล้ว — กรอกจำนวน (${r.unit_base})`,'ok');
}
function countRow(x){
  const byM = x.bpm>1;
  return `<div class="li" data-item="${x.id}" data-bpm="${x.bpm}">
        <div class="nm">${esc(x.label)}${byM?`<small>1 ${esc(x.um)} = ${fmt(x.bpm)} ${esc(x.ub)}</small>`:''}</div>
        ${byM?`<input type="number" inputmode="numeric" min="0" step="1" class="cM" placeholder=" " style="width:72px">
               <div class="u">${esc(x.um)}</div>`:''}
        <input type="number" inputmode="decimal" min="0" step="any" class="cm" placeholder=" " style="width:72px">
        <div class="u">${esc(x.ub)}</div>
      </div>`;
}
function scCount(){
  const fac = S.loc.kind==='factory';
  const its = S.M.items.filter(x=> (fac ? true : (!x.fac && x.level==='packed')) && itemHere(x, S.loc.id));
  const title = fac ? 'นับสต๊อกโรงงาน' : 'นับสต๊อกประจำวัน';
  let html = '', cat = '';
  const groups = [
    ...(fac ? [['ไส้ (กก.)', x=>x.level==='filling']] : []),
    ['ของพร้อมขาย', x=>x.level==='packed' && x.cat!=='SUPPLY'],
    ['🧴 ของใช้', x=>x.cat==='SUPPLY'],
    ...(fac ? [['วัตถุดิบ', x=>x.level==='raw']] : []),
  ];
  for(const [gname, gf] of groups){
    const g = its.filter(gf);
    if(!g.length) continue;
    const isSup = gname.includes('ของใช้'), isRaw = gname==='วัตถุดิบ';
    html += `<div class="card"><h3>${esc(gname)}</h3>${isSup
      ? `<div class="xs mut" style="margin:-4px 0 8px">นับเฉพาะ<b>แพ็กที่ยังไม่เปิด</b> · แพ็กที่เปิดแล้วไม่ต้องนับ</div>` : ''}<div class="lst"${isSup?' id="supl"':(isRaw?' id="rawl"':'')}>`;
    for(const x of g){
      if(isSup){ html += supRow(x); continue; }
      html += countRow(x);
    }
    html += `</div>${isSup ? addSupBox('sup') : (isRaw ? addSupBox('raw') : '')}</div>`;
  }
  app.innerHTML = header(title, S.loc.name, viewHome) + `<main>
    <div class="note" id="cmode">นับของจริงที่เห็นตรงหน้า · <b>ต้องกรอกทุกช่อง</b> · ของที่ไม่มี ใส่ 0</div>
    ${dateField('d')}
    ${html}
    <div class="fld"><label class="fl">หมายเหตุ (ไม่บังคับ)</label><input id="nt"></div>
    <button class="btn" id="save">ส่งผลการนับ</button>
  </main>`;
  wire(viewHome);
  app.querySelector('main').addEventListener('input', e=>{
    const li = e.target.closest('.li.miss');
    if(li){ const M = li.querySelector('.cM'), m = li.querySelector('.cm'), K = li.querySelector('.ckg');
      if(((M && M.value!=='') || (m && m.value!=='')) && !(K && K.value==='')) li.classList.remove('miss'); }
    if(e.target.classList.contains('ckg')) oilPreview(e.target.closest('.li'));
  });
  app.querySelector('main').addEventListener('click', e=>{
    const op = e.target.closest('[data-addopen]');
    if(op){ const bx = document.querySelector(`[data-addbox="${op.dataset.addopen}"]`); bx.style.display='block'; op.style.display='none'; bx.querySelector('.aN').focus(); return; }
    const ok = e.target.closest('[data-addok]'); if(ok) addSupply(ok);
  });
  // จำเลขที่พิมพ์ค้างไว้ (หน้าโหลดใหม่ / ปิดแอปไป เลขไม่หาย) · ส่งสำเร็จแล้วล้าง
  const dKey = () => 'cdraft_'+S.loc.id+'_'+$('#d').value;
  const dSave = () => { try{
      const o = {}; document.querySelectorAll('.li[data-item]').forEach(li=>{
        const v = [...li.querySelectorAll('input')].map(i=>i.value);
        if(v.some(x=>x!=='')) o[li.dataset.item] = v; });
      localStorage.setItem(dKey(), JSON.stringify({t:Date.now(), v:o, nt:$('#nt').value}));
    }catch(err){} };
  const dLoad = () => { try{
      const r = JSON.parse(localStorage.getItem(dKey())||'null'); if(!r || !r.v) return 0; let n = 0;
      Object.entries(r.v).forEach(([id,v])=>{ const li = document.querySelector(`.li[data-item="${id}"]`); if(!li) return;
        [...li.querySelectorAll('input')].forEach((i,k)=>{ if(v[k]!==undefined && v[k]!=='' && v[k]!==i.value){ i.value = v[k]; i.classList.remove('pf'); } }); n++;
        if(li.dataset.oil) oilPreview(li); });
      if(r.nt) $('#nt').value = r.nt;
      return n;
    }catch(err){ return 0; } };
  app.querySelector('main').addEventListener('input', e=>{ if(e.target.closest('.li[data-item]') || e.target.id==='nt') dSave(); });
  // เปิดนับซ้ำในวันเดียวกัน → ขึ้นเลขล่าสุดที่ส่งไว้ · แก้ตัวที่ต้องแก้ · กดส่ง = ทับทั้งใบ (เจ้าของสั่ง 26 ก.ย.)
  //   ของที่ยังไม่เคยส่งวันนี้ (เช่น ของที่เพิ่งเพิ่ม) = ช่องว่าง ต้องกรอก · เลขที่พิมพ์ค้างไว้ (ยังไม่ส่ง) ทับเลขที่ส่งแล้ว
  const FULL = `นับของจริงที่เห็นตรงหน้า · <b>ต้องกรอกทุกช่อง</b> · ของที่ไม่มี ใส่ 0`;
  const prefill = async ()=>{
    let rows = [];
    try{ const r = await sb.rpc('fn_count_prefill', { p_branch:S.loc.id, p_on:$('#d').value }); if(!r.error) rows = r.data || []; }catch(err){}
    const n = $('#cmode');
    if(!rows.length){ if(n){ n.classList.remove('okbox'); n.innerHTML = FULL; } return 0; }
    rows.forEach(r=>{
      const li = document.querySelector(`.li[data-item="${r.stock_item_id}"]`); if(!li) return;
      const M = li.querySelector('.cM'), m = li.querySelector('.cm'), K = li.querySelector('.ckg');
      const put = (i, v)=>{ if(i){ i.value = String(+num(v)); i.classList.add('pf'); } };
      if(K){ put(M, r.qty_major); if(r.weighed_kg != null) put(K, r.weighed_kg); if(li.dataset.oil) oilPreview(li); }
      else if(M && m){ put(M, r.qty_major); put(m, r.qty_minor); }
      else if(M){ put(M, r.qty_major); }
      else if(m){ put(m, r.qty_base); }
    });
    const last = rows.reduce((a,r)=> !a || r.submitted_at > a.submitted_at ? r : a, null);
    const tm = new Date(last.submitted_at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'});
    if(n){ n.classList.add('okbox');
      n.innerHTML = `วันนี้ที่นี่ส่งไปแล้ว (ล่าสุด ${tm}${last.by_name ? ' · ' + esc(last.by_name) : ''}) · <b>ช่องขึ้นเลขล่าสุดที่ส่งไว้</b> (ตัวสีจาง)<br>
        นับใหม่/แก้ตัวที่ต้องแก้ แล้วกดส่ง · <b>ทุกช่องจะบันทึกทับของเดิม</b> · ช่องที่ว่าง = ยังไม่เคยนับ ต้องกรอก`; }
    return rows.length;
  };
  const clearAll = ()=> document.querySelectorAll('.li[data-item] input').forEach(i=>{ i.value=''; i.classList.remove('pf'); });
  app.querySelector('main').addEventListener('input', e=>{ if(e.target.classList) e.target.classList.remove('pf'); });
  const init = async ()=>{
    await prefill();
    const restored = dLoad();
    if(restored) toast(`ดึงเลขที่กรอกค้างไว้ (ยังไม่ได้ส่ง) กลับมา ${restored} รายการ · ตรวจแล้วกดส่งได้เลย`,'ok');
  };
  init();
  $('#d').addEventListener('change', ()=>{ clearAll(); init(); });
  $('#save').onclick = async e=>{
    // บังคับทุกช่อง: ช่องว่าง ≠ 0 (อาจลืมนับ) → ไม่เดาให้ · ของที่ไม่มีต้องใส่ 0 เอง
    const blank = [...document.querySelectorAll('.li[data-item]')].filter(li=>{
      const M = li.querySelector('.cM'), m = li.querySelector('.cm'), K = li.querySelector('.ckg');
      const cnt = (M && M.value!=='') || (m && m.value!=='');
      return !cnt || (K && K.value==='');
    });
    document.querySelectorAll('.li.miss').forEach(li=>li.classList.remove('miss'));
    if(blank.length){
      blank.forEach(li=>li.classList.add('miss'));
      const f = blank[0];
      f.scrollIntoView({block:'center', behavior:'smooth'});
      const emp = [...f.querySelectorAll('input')].find(i=>i.value==='');
      if(emp) setTimeout(()=>emp.focus({preventScroll:true}), 350);
      return toast(`ยังไม่ได้นับ ${blank.length} รายการ (กรอบแดง) · ของที่ไม่มี ใส่ 0`,'bad');
    }
    const oilBad = [...document.querySelectorAll('.li[data-oil] .oilp .diffneg')];
    if(oilBad.length) return toast('น้ำหนักน้ำมันดูผิดปกติ — ชั่งใหม่อีกที','bad');
    const lines = [...document.querySelectorAll('.li[data-item]')].map(li=>{
      const bpm = num(li.dataset.bpm);
      const M = li.querySelector('.cM'), m = li.querySelector('.cm'), K = li.querySelector('.ckg');
      const major = M?num(M.value):0, minor = m?num(m.value):0;
      const l = { item: li.dataset.item, major, minor, base: major*bpm + minor,
               touched: (M && M.value!=='') || (m && m.value!=='') || (K && K.value!=='') };
      if(K && K.value!=='') l.kg = num(K.value);   // ชั่งจริง → ระบบแปลงเป็นลิตรเอง
      return l;
    });
    const filled = lines.filter(l=>l.touched);
    if(!filled.length) return toast('ยังไม่ได้นับอะไรเลย','bad');
    busy(e.target,true);
    const { data, error } = await sb.rpc('fn_save_count',{
      p_branch:S.loc.id, p_kind: fac?'weekly':'daily', p_on:$('#d').value,
      p_note:$('#nt').value, p_lines: lines.map(({item,major,minor,base,kg})=>(kg===undefined ? {item,major,minor,base} : {item,major,minor,base,kg}))
    });
    busy(e.target,false,'ส่งผลการนับ');
    if(error) return toast(errMsg(error),'bad');
    try{ localStorage.removeItem(dKey()); }catch(err){}
    await loadOnHand(S.loc.id);
    countResult(data);
  };
}

   10 · เช็กลิสต์ประจำวัน — ใครส่งรายงานแล้ว ใครยังไม่ส่ง

async function scCheck(day){
  const d = day || today();
  app.innerHTML = header('เช็กลิสต์วันนี้','', viewHome) + `<main>
    <div class="fld"><label class="fl">วันที่</label><input id="d" type="date" value="${d}"></div>
    <div id="body"><div class="ldg">กำลังตรวจ…</div></div>
  </main>`;
  wire(viewHome);
  $('#d').onchange = ()=> scCheck($('#d').value);

  const { data, error } = await sb.rpc('fn_daily_checklist', { p_on: d });
  if(error){ $('#body').innerHTML = `<div class="note err">${esc(errMsg(error))}</div>`; return; }
  const rows = data || [];
  if(!rows.length){ $('#body').innerHTML = '<div class="note">ไม่มีสาขาที่เปิดอยู่ในวันนี้</div>'; return; }

  // จัดกลุ่มตามที่ตั้ง · ที่ยังไม่ครบขึ้นก่อน
  const g = new Map();
  rows.forEach(r=>{
    if(!g.has(r.branch_name)) g.set(r.branch_name, { kind:r.branch_kind, tasks:[] });
    g.get(r.branch_name).tasks.push(r);
  });
  const list = [...g.entries()].sort((a,b)=>{
    const na = a[1].tasks.filter(t=>!t.done).length, nb = b[1].tasks.filter(t=>!t.done).length;
    if(na !== nb) return nb - na;
    if(a[1].kind !== b[1].kind) return a[1].kind === 'factory' ? -1 : 1;
    return a[0].localeCompare(b[0],'th');
  });

  const doneN = rows.filter(r=>r.done).length, allN = rows.length;
  const late  = list.filter(([,v])=>v.tasks.some(t=>!t.done));
  const pct   = Math.round(doneN/allN*100);
  const hhmm  = t => t ? new Date(t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'}) : '';

  $('#body').innerHTML = `
    <div class="card">
      <div class="seg"><span class="sm mut">ส่งครบแล้ว</span>
        <span class="p">${doneN} <span class="mut xs">/ ${allN} รายการ · ${pct}%</span></span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="xs ${late.length?'':'mut'}" style="margin-top:6px">${late.length
        ? `<span class="diffpos">ยังไม่ครบ ${late.length} ที่:</span> ${late.map(([n])=>esc(n)).join(' · ')}`
        : 'ครบทุกที่แล้ว 👍'}</div>
    </div>
    ${list.map(([name, v])=>`
      <div class="card">
        <h3>${v.kind==='factory'?'🏭':(v.kind==='popup'?'⛺':'🏬')} ${esc(name)}</h3>
        ${v.tasks.map(t=>`<div class="ck ${t.done?'':'no'}">
          <div class="mk">${t.done?'✅':'⬜'}</div>
          <div class="bd"><b>${esc(t.task_label)}</b>
            <span>${t.done && t.by_name ? `${esc(t.by_name)} · ${hhmm(t.done_at)}` : esc(t.detail||'')}</span></div>
        </div>`).join('')}
      </div>`).join('')}
    <div class="xs mut" style="margin-bottom:20px">หน้านี้บอกแค่ว่ามีอะไรส่งเข้ามาแล้วบ้าง ไม่ได้ตัดสินว่าใครผิด · เปลี่ยนวันที่ด้านบนเพื่อดูย้อนหลังได้</div>`;
}

function showToken(r, pin){

const ROLE_LIST = [
  ['branch',  'พนักงานสาขา',   'นับสต๊อก · รับของ · ส่งของ · แจ้งของเสีย'],
  ['factory', 'หัวหน้าโรงงาน', 'ทำไส้ · ม้วน · ส่งของ + เห็นภาพรวมทั้งบริษัท'],
  ['manager', 'หัวหน้า',       'เห็นและแก้ได้ทุกที่ เหมือนเจ้าของ'],
  ['owner',   'เจ้าของ',       'ทุกอย่าง + ตั้งสิทธิ์คนอื่นได้ + รับแจ้งเตือน LINE ทุกรอบ'],
];
const roleName = r => (ROLE_LIST.find(x=>x[0]===r)||[,'—'])[1];

async function staffApi(payload){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) throw new Error('หมดเวลาใช้งาน กรุณาเข้าระบบใหม่');
  const r = await fetch(SB_URL + '/functions/v1/staff-admin', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey: SB_KEY,
              Authorization: 'Bearer ' + session.access_token },
    body: JSON.stringify(payload),
  });
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(!r.ok || j.error) throw new Error(j.error || ('ผิดพลาด ' + r.status));
  return j;
}

function sheet(html){
  const w = document.createElement('div');
  w.className = 'sheet';
  w.innerHTML = `<div class="sheetbox">${html}</div>`;
  document.body.appendChild(w);

  return { el:w, close };
}

  const on  = rows.filter(r=>r.active);
  const off = rows.filter(r=>!r.active);
  const dt = d => d ? new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}) : '';

  const card = r => `<div class="ck" data-emp="${r.employee_id}" style="cursor:pointer">
      <div class="mk">${r.linked?'💬':'⬜'}</div>
      <div class="bd">
        <b>${esc(r.nickname)} <span class="xs mut" style="font-weight:400">· ${esc(roleName(r.role))}</span></b>
        <span>${esc(r.job_type||'ยังไม่ระบุตำแหน่ง')}${r.phone?' · '+esc(r.phone):''}${
          r.active ? (r.linked?'':' · ยังไม่ผูก LINE') : ' · ออกเมื่อ '+dt(r.terminated_on)}</span>
      </div>

      ${on.map(card).join('') || '<div class="xs mut">ยังไม่มีใคร</div>'}
    </div>
    ${off.length?`<div class="card"><h3 class="mut">ออกแล้ว (${off.length} คน)</h3>${off.map(card).join('')}</div>`:''}
    <div class="xs mut" style="margin-bottom:20px">คนออกจะไม่ถูกลบทิ้ง — ใบส่งของและยอดนับเก่ายังอ้างชื่อได้ครบ
    แค่หายจากหน้าเลือกชื่อตอนเข้าระบบ และหยุดรับแจ้งเตือน</div>`;

    const t = e.target.closest('[data-emp]'); if(!t) return;
    const r = rows.find(x=>x.employee_id===t.dataset.emp); if(r) menuStaff(r);

function menuStaff(r){
  const mine = S.me.employee_id === r.employee_id;
  const s = sheet(`
    <h3 style="margin:0 0 2px">${esc(r.nickname)}</h3>
    <div class="xs mut" style="margin-bottom:14px">${esc(roleName(r.role))}${r.job_type?' · '+esc(r.job_type):''}${
      r.linked?' · ผูก LINE แล้ว':''}</div>
    <button class="btn gh" data-a="edit">แก้ข้อมูลส่วนตัว</button>
    ${mine?'':`<button class="btn gh" data-a="role">เปลี่ยนสิทธิ์</button>`}
    ${r.linked?`<button class="btn gh" data-a="unlink">ปลด LINE (เปลี่ยนเครื่อง/เบอร์)</button>`:''}
    ${r.active
      ? (mine ? '' : `<button class="btn gh" data-a="term" style="color:var(--bad);border-color:var(--bad)">แจ้งออกจากงาน</button>`)
      : `<button class="btn gh" data-a="back">กลับเข้าทำงาน</button>`}
    <button class="btn gh sm2" data-a="close">ปิด</button>`);

  s.el.querySelector('.sheetbox').onclick = async e => {
    const b = e.target.closest('[data-a]'); if(!b) return;
    const a = b.dataset.a;
    if(a==='close') return s.close();
    if(a==='edit')  { s.close(); return formStaff(r); }
    if(a==='role')  { s.close(); return formRole(r); }
    if(a==='unlink'){
      if(!confirm(`ปลด LINE ของ ${r.nickname}?\nน้องจะไม่ได้รับแจ้งเตือนจนกว่าจะผูกใหม่`)) return;
      busy(b,true,'ปลด LINE'); try{ await staffApi({action:'unlink', employee_id:r.employee_id});
        s.close(); toast('ปลด LINE แล้ว — ออกโค้ดใหม่ให้น้องได้เลย','ok'); await loadStaff();
      }catch(err){ busy(b,false,'ปลด LINE'); toast(errMsg(err),'bad'); }
      return;
    }
    if(a==='term'){
      if(!confirm(`แจ้ง ${r.nickname} ออกจากงาน?\nชื่อในใบเก่ายังอยู่ครบ แต่จะเข้าระบบไม่ได้อีก`)) return;
      busy(b,true,'แจ้งออก'); try{ await staffApi({action:'terminate', employee_id:r.employee_id});
        s.close(); toast(`บันทึกว่า ${r.nickname} ออกแล้ว`,'ok'); await loadStaff();
      }catch(err){ busy(b,false,'แจ้งออก'); toast(errMsg(err),'bad'); }
      return;
    }
    if(a==='back'){
      busy(b,true,'กลับเข้าทำงาน'); try{ await staffApi({action:'reactivate', employee_id:r.employee_id});
        s.close(); toast(`${r.nickname} กลับเข้าทำงานแล้ว`,'ok'); await loadStaff();
      }catch(err){ busy(b,false,'กลับเข้าทำงาน'); toast(errMsg(err),'bad'); }
    }
  };
}
