async function drawPerf(on){
  const box = $('#pf'); if(!box) return;
  box.innerHTML = '<div class="ldg">กำลังรวมตัวเลข…</div>';
  const pv = new Date(on+'T00:00:00'); pv.setDate(pv.getDate()-1);
  const [a, b, c] = await Promise.all([
    sb.rpc('fn_daily_perf', { p_on: on }),
    sb.rpc('fn_daily_perf', { p_on: pv.toLocaleDateString('sv-SE') }),
    sb.rpc('fn_supply_status', {}),
  ]);
  if(a.error){ box.innerHTML = `<div class="note err">${esc(errMsg(a.error))}</div>`; return; }
  const R = a.data || [], Y = b.data || [];
  const of  = (rows, s) => rows.filter(r => r.section === s);
  const tot = (rows, s, unit) => of(rows, s)
    .filter(r => r.qty !== null && (!unit || r.unit === unit))
    .reduce((t, r) => t + num(r.qty), 0);
  const grp = (rows, key = r => r.loc) => { const m = new Map();
    rows.forEach(r => { const k = key(r); if(!m.has(k)) m.set(k, []); m.get(k).push(r); }); return m; };
  const short = s => String(s||'').replace(/^Dip /,'').replace(/ \d+ กรัม$/,'');
  const uTag = u => (u && u !== 'ชิ้น') ? ` <span class="mut xs">${esc(u)}</span>` : '';

  // ขายรวมทั้งวัน (ชิ้น) เทียบปิดวันก่อน · นับเฉพาะของที่มียอดนับวันก่อน
  const daySold = rows => {
    const hasPrev = new Set(of(rows,'prev').map(r => r.loc + '|' + r.item));
    return of(rows,'sold').filter(r => r.qty !== null && r.unit === 'ชิ้น' && hasPrev.has(r.loc + '|' + r.item))
      .reduce((t, r) => t + num(r.qty), 0);
  };
  // ---- ตัวเลขใหญ่ 3 ตัว เทียบเมื่อวาน ----
  const tile = (v, y, d, label) => {
    const arrow = (v && y) ? (v > y ? '▲' : v < y ? '▼' : '') : '';
    return `<div class="t"><b>${v ? fmt(v, d) : '—'}</b><span>${label}</span>
      <span>เมื่อวาน ${y ? fmt(y, d) : '—'} ${arrow ? `<span class="${v > y ? 'diffz' : 'diffneg'}">${arrow}</span>` : ''}</span></div>`;
  };
  const hero = `<div class="hero">
    ${tile(tot(R,'roll'), tot(Y,'roll'), 0, 'ม้วนได้ · ชิ้น')}
    ${tile(tot(R,'make'), tot(Y,'make'), 1, 'ทำไส้ · กก.')}
    ${tile(daySold(R), daySold(Y), 0, 'สาขาขาย · ชิ้น')}
  </div>`;

  // ================= สาขา =================
  const sup = (c && !c.error ? c.data || [] : []).filter(r => r.status !== 'ok');
  const supBy = grp(sup, r => r.branch_name);
  const soldBy = grp(of(R,'sold')), usedBy = grp(of(R,'used')), leftBy = grp(of(R,'left')), prevBy = grp(of(R,'prev'));
  const branchLocs = [...new Set([...leftBy.keys(), ...soldBy.keys()])];

  const branchCard = loc => {
    const left = (leftBy.get(loc) || []).sort((x, y) => String(x.sort2).localeCompare(String(y.sort2)));
    const moves = [...(soldBy.get(loc) || []), ...(usedBy.get(loc) || [])];
    const prevM = new Map((prevBy.get(loc) || []).map(r => [r.item, r]));
    // ขาย/ใช้ไป เทียบปิดวันก่อน = ผลรวมทุกรอบของวัน (ยกมา + เข้า − เหลือ) · ไม่มียอดวันก่อน = ตั้งต้น
    const day = new Map();
    left.forEach(l => {
      const pv = prevM.get(l.item);
      const sup = S.M.items.some(x => x.label === l.item && x.cat === 'SUPPLY');
      if(!pv){ day.set(l.item, { first: true, sup }); return; }
      const q = moves.filter(r => r.item === l.item && r.qty !== null).reduce((t, r) => t + num(r.qty), 0);
      day.set(l.item, { first: false, sup, prev: num(pv.qty), on: pv.extra, sold: q, left: num(l.qty), inq: q + num(l.qty) - num(pv.qty) });
    });
    const rounds = [...new Set(moves.map(r => r.sort2))].sort((x, y) => String(x.split('|')[1]).localeCompare(String(y.split('|')[1])));
    const lastR = rounds.length ? moves.find(r => r.sort2 === rounds[rounds.length - 1]) : null;
    const soldPcs = left.reduce((t, l) => { const d = day.get(l.item); return t + (d && !d.first && !d.sup && l.unit === 'ชิ้น' ? d.sold : 0); }, 0);
    const prevOn = [...day.values()].filter(d => !d.first).map(d => d.on)[0] || '';
    const yday = (() => { const x = new Date(on + 'T00:00:00'); x.setDate(x.getDate() - 1);
      return String(x.getDate()).padStart(2, '0') + '/' + String(x.getMonth() + 1).padStart(2, '0'); })();

    const soldCell = d => {
      if(!d || d.first) return `<td class="n mut xs">ตั้งต้น</td>`;
      if(d.sold < 0) return `<td class="n diffpos" style="white-space:nowrap">เกิน ${fmt(-d.sold)}</td>`;
      return `<td class="n ${d.sold ? '' : 'mut'}"><b>${fmt(d.sold)}</b></td>`;
    };
    const prod = left.filter(l => !(day.get(l.item) || {}).sup);
    const sups = left.filter(l => (day.get(l.item) || {}).sup);
    const prodRows = prod.map(l => { const d = day.get(l.item) || {};
      return `<tr><td>${esc(short(l.item))}${uTag(l.unit)}</td>
        <td class="n mut">${d.first ? '—' : fmt(d.prev)}</td>
        <td class="n mut">${d.first || !d.inq ? '' : (d.inq > 0 ? '+' : '') + fmt(d.inq)}</td>
        <td class="n">${fmt(l.qty)}</td>${soldCell(d)}</tr>`; }).join('');
    const supRows = sups.map(l => { const d = day.get(l.item) || {}; const v = supQty(l.item, l.qty);
      let used;
      if(d.first) used = `<span class="mut xs">ตั้งต้น</span>`;
      else if(d.sold < 0){ const u = supQty(l.item, -d.sold); used = `<span class="diffpos">เกิน ${u.n}</span>`; }
      else { const u = supQty(l.item, d.sold); used = `${u.n}${u.r ? ` <span class="mut xs">${esc(u.r)}</span>` : ''}`; }
      return `<tr><td colspan="2">${esc(l.item)} <span class="mut xs">${esc(v.u)}</span></td><td></td>
        <td class="n" style="white-space:nowrap">${v.n}${v.r ? ` <span class="mut xs">${esc(v.r)}</span>` : ''}</td>
        <td class="n" style="white-space:nowrap">${used}</td></tr>`; }).join('');

    const flags = supBy.get(loc) || [];
    const oldPrev = prevOn && prevOn !== yday;
    return `<div class="card">
      <h3 style="margin-bottom:2px">🏬 ${esc(loc)}</h3>
      <div class="xs mut" style="margin-bottom:8px">${lastR
        ? `นับ ${rounds.length} รอบ · ล่าสุด ${esc(String(lastR.extra || '').split('|')[0])}${lastR.who ? ' ' + esc(lastR.who) : ''}`
        : 'วันนี้ยังไม่นับ'}${soldPcs ? ` · <b style="color:var(--tx)">ขายรวม ${fmt(soldPcs)} ชิ้น</b>` : ''}${prevOn ? ` · เทียบปิด ${esc(prevOn)}` : ''}</div>
      ${oldPrev ? `<div class="xs diffpos" style="margin:-4px 0 8px">ยกมาจากยอดนับ ${esc(prevOn)} (ไม่ได้นับระหว่างนั้น) · ยอดขายนี้รวมหลายวัน</div>` : ''}
      ${left.length ? `<table>
        <tr><th></th><th class="n">ยกมา</th><th class="n">เข้า</th><th class="n">เหลือ</th><th class="n">ขาย</th></tr>
        ${prodRows}
        ${supRows ? `<tr><th colspan="3" style="padding-top:14px">🧴 ของใช้</th><th class="n" style="padding-top:14px">เหลือ</th><th class="n" style="padding-top:14px">ใช้ไป</th></tr>${supRows}` : ''}
      </table>` : ''}
      ${flags.length ? `<div class="sm" style="margin-top:10px">⚠️ แจ้งมา: ${flags.map(r =>
        `<span class="${r.status === 'out' ? 'diffneg' : 'diffpos'}">${esc(r.label)} ${r.status === 'out' ? 'หมด' : 'ใกล้หมด'}</span>`).join(' · ')}</div>` : ''}
    </div>`;
  };

  const noCount = of(R,'nocount').map(r => r.loc);
  let branchHtml = branchLocs.map(branchCard).join('');
  if(noCount.length) branchHtml += `<div class="note">ยังไม่นับวันนี้ → ยังไม่รู้ยอดขาย: <b>${noCount.map(esc).join(' · ')}</b></div>`;
  if(!branchHtml) branchHtml = `<div class="card"><div class="xs mut">ยังไม่มีสาขาไหนนับ</div></div>`;

  // ================= โรงงาน =================
  const facLocs = [...new Set(['make','roll','roller','sauce'].flatMap(s => of(R, s).map(r => r.loc)))];
  const specTag = extra => {
    const m = /([\d.]+) ก\.\/ชิ้น \(สเปก ([\d.]+)\)/.exec(extra || '');
    if(!m) return '';
    const g = +m[1], s = +m[2], p = (g - s) / s * 100;
    return Math.abs(p) <= 5 ? `<span class="diffz">ตรงสเปก</span>`
      : `<span class="${p < 0 ? 'diffneg' : 'diffpos'}">ไส้${p < 0 ? 'น้อย' : 'มาก'} ${fmt(Math.abs(p))}%</span>`;
  };
  const facCard = loc => {
    const roll = of(R,'roll').filter(r => r.loc === loc);
    const rollers = of(R,'roller').filter(r => r.loc === loc).sort((x, y) => num(y.qty) - num(x.qty));
    const make = of(R,'make').filter(r => r.loc === loc);
    const sauce = of(R,'sauce').filter(r => r.loc === loc);
    const sec = (t) => `<tr><th colspan="3" style="padding-top:14px">${t}</th></tr>`;
    return `<div class="card"><h3>🏭 ${esc(loc)}</h3><table>
      ${roll.length ? sec('🌯 ม้วน') + roll.map(r => `<tr>
          <td>${esc(r.item)}<div class="xs mut">${esc((r.extra || '').replace(/ \(สเปก [\d.]+\)/, ''))}</div></td>
          <td class="n xs" style="white-space:nowrap">${specTag(r.extra)}</td>
          <td class="n"><b>${fmt(r.qty)}</b> <span class="mut xs">ชิ้น</span></td></tr>`).join('') : ''}
      ${rollers.length ? `<tr><td colspan="3" class="xs mut" style="border:none;padding-top:6px">ใครม้วน: ${rollers.map(r => `<b style="color:var(--tx)">${esc(r.who)}</b> ${fmt(r.qty)}`).join(' · ')}</td></tr>` : ''}
      ${make.length ? sec('🥣 ทำไส้') + make.map(r => `<tr><td>${esc(r.item)}</td>
          <td class="n xs mut">${esc(r.extra || '')}</td><td class="n"><b>${fmt(r.qty, 2)}</b> <span class="mut xs">${esc(r.unit)}</span></td></tr>`).join('') : ''}
      ${sauce.length ? sec('🥫 ผสม / แบ่งบรรจุ') + sauce.map(r => `<tr><td>${esc(short(r.item))}</td><td></td>
          <td class="n"><b>${fmt(r.qty)}</b> <span class="mut xs">${esc(r.unit)}</span></td></tr>`).join('') : ''}
    </table></div>`;
  };
  let facHtml = facLocs.map(facCard).join('');
  if(!facHtml) facHtml = `<div class="card"><h3>🏭 โรงงาน</h3><div class="xs mut">วันนี้ยังไม่มีบันทึกทำไส้ / ม้วน</div></div>`;

  // ---- ส่งออกจากโรงงาน: 1 บรรทัดต่อปลายทาง กดดูรายการได้ ----
  let shipHtml = '';
  grp(of(R,'ship')).forEach((rows, loc) => {
    const waiting = rows.some(r => (r.extra || '').startsWith('ยังไม่กดรับ'));
    shipHtml += `<details style="padding:8px 0;border-top:1px solid var(--line)">
      <summary class="seg" style="cursor:pointer;list-style:none"><span class="sm">→ ${esc(loc)}</span>
        <span class="p ${waiting ? 'diffpos' : 'diffz'}">${rows.length} รายการ · ${waiting ? 'ยังไม่กดรับ' : 'รับแล้ว ✓'}</span></summary>
      <table style="margin-top:6px">${rows.map(r => `<tr><td>${esc(short(r.item))}</td>
        <td class="n">${fmt(r.qty)} <span class="mut xs">${esc(r.unit)}</span></td>
        <td class="n xs mut">${esc((r.extra || '').startsWith('รับจริง') ? r.extra : '')}</td></tr>`).join('')}</table>
    </details>`;
  });

  // ---- ของเสีย ----
  let wasteHtml = '';
  grp(of(R,'waste')).forEach((rows, loc) => {
    wasteHtml += `<div class="sm" style="margin:6px 0"><b>${esc(loc)}</b>: ${rows.map(r =>
      `${esc(short(r.item))} <span class="diffneg">${fmt(r.qty, 2)}</span> ${esc(r.unit)}`).join(' · ')}</div>`;
  });

  const canEditFlags = S.me.role === 'owner' || S.me.role === 'manager';
  box.innerHTML = hero
    + `<div class="xs mut" style="margin:14px 2px 6px;font-weight:600;letter-spacing:.3px">สาขา</div>` + branchHtml
    + `<div class="xs mut" style="margin:14px 2px 6px;font-weight:600;letter-spacing:.3px">โรงงาน</div>` + facHtml
    + (shipHtml ? `<div class="card"><h3>🚚 ส่งของออก</h3>${shipHtml}</div>` : '')
    + (wasteHtml ? `<div class="card"><h3>🗑️ ของเสีย</h3>${wasteHtml}</div>` : '')
    + `<div class="card xs mut" style="line-height:1.7">
        <b style="color:var(--tx)">อ่านตัวเลขยังไง</b><br>
        <b>ยกมา</b> = ยอดนับปิดวันก่อน · <b>เข้า</b> = รับของ − ของเสีย − ส่งออก ในวันนั้น · <b>เหลือ</b> = ยอดนับล่าสุดของวันนั้น<br>
        <b>ขาย</b> = ยกมา + เข้า − เหลือ (เทียบกับวันก่อน นับวันละกี่รอบก็ได้ผลเท่าเดิม) · ตอนนี้ยังรวมของหายด้วย เพราะยอด POS ยังไม่เข้าระบบ<br>
        <b class="diffpos">เกิน</b> = นับได้มากกว่าที่ควรมี → มักเป็นของเข้าที่ยังไม่กดรับ หรือนับผิด<br>
        <b>ตั้งต้น</b> = ยังไม่มียอดนับวันก่อน ไม่มีอะไรให้เทียบ · วันถัดไปเริ่มเห็นยอดขาย<br>
        ของใช้นับเป็นแพ็กที่ยังไม่เปิด · <b>ใช้ไป</b> = จำนวนแพ็กที่ถูกเปิดใช้
      </div>`
    + (canEditFlags ? `<button class="btn gh sm2" id="flagAdm" style="margin-bottom:24px">แก้รายการของใช้ / วัตถุดิบที่ให้นับ (ชื่อ · หน่วย · ซ่อน)</button>` : '');
  const fa = $('#flagAdm'); if(fa) fa.onclick = flagAdmin;
}

/* ---------- แก้รายการของใช้ที่ให้นับ (เจ้าของ/หัวหน้า) ---------- */
async function flagAdmin(){
  const { data, error } = await sb.rpc('fn_supply_items_admin');
  if(error) return toast(errMsg(error),'bad');
  const rows = data || [];
  const dt = t => t ? new Date(t).toLocaleDateString('th-TH',{day:'numeric',month:'short',timeZone:'Asia/Bangkok'}) : '';
  const s = sheet(`<h3 style="margin:0 0 4px">รายการของใช้ / วัตถุดิบที่ให้นับ</h3>
    <div class="xs mut" style="margin-bottom:10px">แก้ชื่อ/หน่วยแล้วกด ✓ · <b>ซ่อน</b> = ไม่ต้องนับอีก (ประวัติยังอยู่ · ถ้าหน้าร้านเพิ่มชื่อเดิมมาอีก จะกลับมาเอง) · หน่วยแก้ได้เฉพาะของที่พนักงานเพิ่ม</div>
    <div style="max-height:58vh;overflow:auto">${rows.map(r=>`<div class="li" data-fid="${r.stock_item_id}" style="${r.active?'':'opacity:.5'}">
      <div class="nm"><input class="fl-n" value="${esc(r.label)}" maxlength="60" style="width:100%;font-size:15px;padding:8px;text-align:left">
        <small>${esc(r.catname || '')} · ${r.seeded ? 'ตั้งต้น' : 'เพิ่มโดย ' + esc(r.by_name || '-') + ' · ' + dt(r.added_at)} · นับที่: ${esc(r.locs || 'ทุกที่')}${r.active ? '' : ' · ซ่อนอยู่'}</small></div>
      ${r.seeded ? `<div class="u">${esc(r.unit_base)}</div>` : `<input class="fl-u" value="${esc(r.unit_base)}" maxlength="12" style="width:64px;font-size:14px;padding:8px">`}
      <button class="btn gh sm2" data-a="save" style="width:auto;padding:8px 10px">✓</button>
      <button class="btn gh sm2" data-a="tog" style="width:auto;padding:8px 10px">${r.active ? 'ซ่อน' : 'แสดง'}</button>
    </div>`).join('')}</div>
    <button class="btn gh sm2" id="fa_x" style="margin-top:10px">ปิด</button>`);
  s.el.querySelector('#fa_x').onclick = s.close;
  s.el.querySelector('.sheetbox').addEventListener('click', async e=>{
    const b = e.target.closest('[data-a]'); if(!b) return;
    const li = b.closest('[data-fid]'); const r = rows.find(x=>x.stock_item_id===li.dataset.fid); if(!r) return;
    let args;
    if(b.dataset.a === 'save'){
      args = { p_item: r.stock_item_id, p_label: li.querySelector('.fl-n').value };
      const u = li.querySelector('.fl-u'); if(u && u.value.trim() !== r.unit_base) args.p_unit = u.value;
    } else args = { p_item: r.stock_item_id, p_active: !r.active };
    const res = await sb.rpc('fn_edit_supply_item', args);
    if(res.error) return toast(errMsg(res.error),'bad');
    toast('บันทึกแล้ว','ok');
    try{ await loadMaster(); }catch(err){}
    s.close(); flagAdmin();
  });
}

async function scDash(){
  app.innerHTML = header('ภาพรวมทั้งบริษัท','', viewHome) + `<main><div class="ldg">กำลังรวมตัวเลข…</div></main>`;
  wire(viewHome);
  const { data, error } = await sb.rpc('fn_overview',{ p_as_of: today() });
  if(error){ app.querySelector('main').innerHTML = `<div class="note err">${esc(errMsg(error))}</div>`; return; }

  // "ไส้ x กก. = กี่ชิ้น" ต้องมาจากที่ม้วนได้จริงเท่านั้น · ยังไม่เคยม้วน = ไม่บอก
  let supAll = [];
  try{ const f = await sb.rpc('fn_supply_status', {}); if(!f.error) supAll = f.data || []; }catch(e){}
  const rwAll = await loadRunway();
  const rwBlock = id => {
    const rw = rwAll.filter(x=>x.branch_id===id);
    if(!rw.length) return '';
    const hot = rwHot(rw);
    if(!hot.length) return `<div class="xs mut" style="margin:6px 0 2px">✓ ทุกตัวพอขายถึงรอบส่ง ${dnext(rw[0].next_delivery)}</div>`;
    return `<div class="note err rw" style="margin:8px 0 4px">🚨 <b>อาจหมดก่อนรอบส่ง ${dnext(hot[0].next_delivery)}</b><br>${hot.map(rwLine).join('<br>')}</div>`;
  };
  let gppMap = new Map();
  try{
    const g = await sb.rpc('fn_gram_per_piece');
    (g.data||[]).forEach(r=>{ if(num(r.g_per_piece)>0) gppMap.set(r.label, num(r.g_per_piece)); });
  }catch(e){}
  const FLAV = ['TRUFFLE','SPINACH','PESTO','TOMYUM','BEEF','ONION'];   // ลำดับสีคงที่ ห้ามสลับ
  const colOf = code => { const i = FLAV.indexOf(code); return i >= 0 ? `var(--s${i+1})` : 'var(--mut)'; };
  const pcodeOf = label => {
    const it = S.M.items.find(x => x.label === label);
    return it ? it.pcode : '';
  };

  // จัดข้อมูลตามที่ตั้ง
  const locs = []; const byLoc = new Map();
  for(const r of data){
    if(!byLoc.has(r.branch_name)){ byLoc.set(r.branch_name, {kind:r.branch_kind, id:null, rows:[]}); locs.push(r.branch_name); }
    byLoc.get(r.branch_name).rows.push(r);
  }
  S.M.branches.forEach(b=>{ if(byLoc.has(b.name)) byLoc.get(b.name).id = b.id; });

  const pick = (rows, cat, level) => rows.filter(r => r.category === cat && r.level === level);
  const q = r => num(r.qty_base);

  // ---- ตัวเลขใหญ่ 3 ตัว ----
  let totRoll = 0, totFill = 0, totSauce = 0;
  data.forEach(r=>{
    if(r.category==='ปอเปี๊ยะ' && r.level==='packed') totRoll += q(r);
    if(r.level==='filling') totFill += q(r);
    if(r.category==='ซอส' && r.level==='packed') totSauce += q(r);
  });

  const legend = `<div class="lgd">${FLAV.map((c,i)=>{
      const it = S.M.items.find(x=>x.pcode===c && x.level==='packed');
      return it ? `<i><span class="dot" style="background:var(--s${i+1})"></span>${esc(it.pname)}</i>` : '';
    }).join('')}</div>`;

  // ---- ของใช้ (กล่อง แก้ว ฝา น้ำมัน ไม้จิ้ม …) ----
  const supBlock = (name, g) => {
    const rows = g.rows.filter(r => r.category === 'ของใช้');
    const fl = supAll.filter(r => r.branch_name === name && r.status !== 'ok');
    if(!rows.length && !fl.length) return '';
    return `<hr class="d"><div class="xs mut" style="margin-bottom:4px">🧴 ของใช้</div>
      <div class="chips">${rows.map(r => { const v = supQty(r.label, q(r));
        return `<span class="chip">${esc(r.label)} <b class="${q(r)<0?'diffneg':(q(r)<=0?'mut':'')}">${v.n}</b>
          <span class="mut xs">${esc(v.u)}${v.r ? ' ' + esc(v.r) : ''}</span></span>`; }).join('')}</div>
      ${fl.length ? `<div class="sm" style="margin-top:8px">⚠️ แจ้งมา: ${fl.map(r =>
        `<span class="${r.status === 'out' ? 'diffneg' : 'diffpos'}">${esc(r.label)} ${r.status === 'out' ? 'หมด' : 'ใกล้หมด'}</span>`).join(' · ')}</div>` : ''}`;
  };

  // ---- ซอส: หลอดตู้เย็น (Dip แช่เย็น) เทียบความจุ + ซอสเก็บนอกตู้ ----
  const isChilled = label => (S.M.items.find(x => x.label === label) || {}).chilled;
  const dipName = l => l.replace('Dip ','').replace(' 20 กรัม','');
  const SC = ['var(--s3)','var(--s5)','var(--s4)','var(--s1)'];
  const sauceBlock = (g, sauces) => {
    const cold = sauces.filter(r => isChilled(r.label)), room = sauces.filter(r => !isChilled(r.label));
    const capS = S.M.capSauce.get(g.id) || 0;
    const sumC = cold.reduce((a, r) => a + Math.max(q(r), 0), 0);
    const base = capS > 0 ? Math.max(capS, sumC) : (sumC || 1);
    const pctS = capS > 0 ? Math.round(sumC / capS * 100) : null;
    const coldPos = cold.filter(r => q(r) > 0);
    return `<hr class="d">
      <div class="seg"><span class="sm mut">Dip ในตู้เย็น</span>
        <span class="p">${fmt(sumC)} <span class="mut xs">/ ${capS ? fmt(capS) : '—'} กระปุก${pctS != null ? ` · <span class="${pctS > 100 ? 'diffneg' : ''}">${pctS}%</span>` : ''}</span></span></div>
      <div class="meter">${coldPos.map((r, i) => `<i class="${i === coldPos.length - 1 && sumC >= base ? 'last' : ''}" style="width:${(q(r) / base * 100).toFixed(2)}%;background:${SC[i % SC.length]}" title="${esc(r.label)} ${fmt(q(r))}"></i>`).join('')}</div>
      <div class="chips">${cold.map((r, i) => `<span class="chip"><span class="dot" style="background:${SC[i % SC.length]}"></span>${esc(dipName(r.label))}
        <b class="${q(r) <= 0 ? 'mut' : ''}">${fmt(q(r))}</b></span>`).join('')}</div>
      ${room.length ? `<div class="xs mut" style="margin:10px 0 0">Dip นอกตู้เย็น</div>
        <div class="chips" style="margin-top:4px">${room.map(r => `<span class="chip">${esc(dipName(r.label))}
          <b class="${q(r) <= 0 ? 'mut' : ''}">${fmt(q(r))}</b></span>`).join('')}</div>` : ''}`;
  };

  // ---- หลอดตู้แช่ของแต่ละสาขา ----
  const branchCard = (name, g) => {
    const rows = pick(g.rows, 'ปอเปี๊ยะ', 'packed').filter(r => q(r) > 0);
    const capacity = S.M.cap.get(g.id) || 0;
    const sum = rows.reduce((a,r)=>a+q(r), 0);
    const base = capacity > 0 ? Math.max(capacity, sum) : (sum || 1);
    const pct = capacity > 0 ? Math.round(sum / capacity * 100) : null;
    const segs = rows.map((r,i)=>{
      const c = colOf(pcodeOf(r.label));
      return `<i class="${i===rows.length-1 && sum>=base ? 'last':''}" style="width:${(q(r)/base*100).toFixed(2)}%;background:${c}"
                title="${esc(r.label)} ${fmt(q(r))} ชิ้น"></i>`;
    }).join('');
    const chips = rows.map(r=>{
      const bpm = num(r.base_per_major) || 1, v = q(r);
      return `<span class="chip"><span class="dot" style="background:${colOf(pcodeOf(r.label))}"></span>
        ${esc(r.label)} <b>${fmt(Math.floor(v/bpm))}</b> <span class="mut xs">${esc(r.unit_major||'')}${
          v - Math.floor(v/bpm)*bpm ? ` +${fmt(v-Math.floor(v/bpm)*bpm)}` : ''}</span></span>`;
    }).join('');

    const sauces = pick(g.rows, 'ซอส', 'packed');
    const tater  = pick(g.rows, 'เทเทอร์ท็อต', 'packed');

    return `<div class="card">
      <h3>${g.kind==='popup'?'⛺':'🏬'} ${esc(name)}</h3>
      ${rwBlock(g.id)}
      <div class="seg"><span class="sm mut">ปอเปี๊ยะในตู้แช่</span>
        <span class="p">${fmt(sum)} <span class="mut xs">/ ${capacity?fmt(capacity):'—'} ชิ้น${pct!=null?` · ${pct}%`:''}</span></span></div>
      <div class="meter">${segs || ''}</div>
      ${rows.length ? `<div class="chips">${chips}</div>` : '<div class="empty">ยังไม่มีปอเปี๊ยะในตู้</div>'}
      ${sauces.length ? sauceBlock(g, sauces) : ''}
      ${tater.length ? `<div class="chips" style="margin-top:8px">${tater.map(r=>`<span class="chip">เทเทอร์ท็อต
        <b class="${q(r)<=0?'mut':''}">${fmt(q(r))}</b> <span class="mut xs">ถุง</span></span>`).join('')}</div>` : ''}
      ${supBlock(name, g)}
    </div>`;
  };

  // ---- โรงงาน: ไส้ (กก.) + ปอเปี๊ยะพร้อมส่ง ----
  const factoryCard = (name, g) => {
    const fills = pick(g.rows, 'ปอเปี๊ยะ', 'filling');
    const packs = pick(g.rows, 'ปอเปี๊ยะ', 'packed');
    const maxF = Math.max(1, ...fills.map(q));
    const maxP = Math.max(1, ...packs.map(q));
    const bar = (label, code, v, max, unit, extra) => `
      <div class="brow">
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</div>
        <div class="bar"><i style="width:${(Math.max(v,0)/max*100).toFixed(1)}%;background:${colOf(code)}"></i></div>
        <div class="v">${fmt(v, unit==='กก.'?1:0)} ${esc(unit)}${extra||''}</div>
      </div>`;
    const mats = g.rows.filter(r => r.category==='วัตถุดิบ' || r.category==='วัตถุดิบซอส');
    return `<div class="card">
      <h3>🏭 ${esc(name)}</h3>
      <div class="xs mut" style="margin-bottom:2px">ไส้ในคลัง</div>
      ${fills.length ? fills.map(r=>{
          const nm = r.label.replace('ไส้','');
          const g = gppMap.get(nm);
          return bar(nm, pcodeOf(nm) || '', q(r), maxF, 'กก.',
            g ? ` <span class="mut">(~${fmt(q(r)*1000/g)} ชิ้น)</span>` : '');
        }).join('') : '<div class="empty">ยังไม่มีไส้ในคลัง</div>'}
      <hr class="d">
      <div class="xs mut" style="margin-bottom:2px">ปอเปี๊ยะพร้อมส่ง</div>
      ${packs.length ? packs.map(r=>{
          const bpm = num(r.base_per_major)||1;
          return bar(r.label, pcodeOf(r.label), q(r), maxP, 'ชิ้น',
            ` <span class="mut">(${fmt(Math.floor(q(r)/bpm))} ${esc(r.unit_major||'')})</span>`);
        }).join('') : '<div class="empty">ยังไม่มีของพร้อมส่ง</div>'}
      ${mats.length ? `<hr class="d"><div class="xs mut" style="margin-bottom:4px">วัตถุดิบ</div>
        <div class="chips">${mats.map(r=>`<span class="chip">${esc(r.label)}
          <b class="${q(r)<0?'diffneg':(q(r)<=0?'mut':'')}">${fmt(q(r), r.unit_base==='กก.'?2:0)}</b>
          <span class="mut xs">${esc(r.unit_base)}</span></span>`).join('')}</div>` : ''}
      ${supBlock(name, g)}
    </div>`;
  };

  // ---- ตารางครบทุกรายการ ----
  const tableView = () => {
    let html = '';
    for(const name of locs){
      const g = byLoc.get(name); let c2 = '';
      html += `<div class="card"><h3>${g.kind==='factory'?'🏭':(g.kind==='popup'?'⛺':'🏬')} ${esc(name)}</h3><table>`;
      for(const r of g.rows){
        if(r.category !== c2){ c2 = r.category; html += `<tr><th colspan="2" style="padding-top:12px">${esc(c2)}</th></tr>`; }
        const v = q(r), bpm = num(r.base_per_major)||1;
        let right = `${fmt(v, r.unit_base==='กก.'?2:0)} <span class="mut xs">${esc(r.unit_base)}</span>`;
        // หน่วยใหญ่ใช้เฉพาะของพร้อมขาย · ไส้ให้บอกเป็น กก. ตรง ๆ จะได้ไม่งง
        if(r.category === 'ของใช้'){ const sv = supQty(r.label, v);
          right = `${sv.n} <span class="mut xs">${esc(sv.u)}${sv.r ? ' ' + esc(sv.r) : ''}</span>`; }
        else if(bpm > 1 && r.level === 'packed') right = `${fmt(Math.floor(v/bpm))} <span class="mut xs">${esc(r.unit_major||'')}</span>` +
          (v - Math.floor(v/bpm)*bpm ? ` <span class="mut xs">+ ${fmt(v-Math.floor(v/bpm)*bpm)} ${esc(r.unit_base)}</span>` : '');
        html += `<tr><td>${esc(r.label)}</td><td class="n ${v<0?'diffneg':(v===0?'mut':'')}" style="white-space:nowrap">${right}</td></tr>`;
      }
      html += `</table></div>`;
    }
    return html;
  };

  const picture = () => `
    ${legend}
    ${locs.filter(n=>byLoc.get(n).kind==='factory').map(n=>factoryCard(n, byLoc.get(n))).join('')}
    ${locs.filter(n=>byLoc.get(n).kind!=='factory').map(n=>branchCard(n, byLoc.get(n))).join('')}`;

  const shell = (body, mode) => `
    <div class="viz">
      <div class="xs mut" style="margin-bottom:10px">ณ ${today()} · ตัวเลขนี้คือ "ควรเหลือ" จากทุกการเคลื่อนไหวที่บันทึกไว้</div>
      <div class="hero">
        <div class="t"><b>${fmt(totRoll)}</b><span>ปอเปี๊ยะพร้อมขาย (ชิ้น)</span></div>
        <div class="t"><b>${fmt(totFill,1)}</b><span>ไส้ในคลัง (กก.)</span></div>
        <div class="t"><b>${fmt(totSauce)}</b><span>Dip (กระปุก)</span></div>
      </div>
      ${rwAll.length ? (()=>{ const n = rwAll.filter(x=>x.level==='red').length;
        return `<div class="xs ${n?'diffneg':'mut'}" style="margin:0 0 10px">${n ? `🚨 ${n} รายการอาจหมดก่อนรอบส่ง ${dnext(rwAll[0].next_delivery)} (ดูในการ์ดสาขา)` : `✓ ทุกสาขาพอขายถึงรอบส่ง ${dnext(rwAll[0].next_delivery)}`}
          <br><span class="mut">"พอขาย" = ที่เหลือตอนนับล่าสุด ÷ ขายเฉลี่ยต่อวันจาก POS (ถึง ${ddmm(rwAll.map(x=>x.rate_to).sort().pop())})</span></div>`; })() : ''}
      <div class="tabs">
        <button data-m="pic" class="${mode==='pic'?'on':''}">แบบรูป</button>
        <button data-m="tab" class="${mode==='tab'?'on':''}">แบบตาราง</button>
      </div>
      ${body}
      <div class="xs mut" style="margin:6px 0 20px">ตัวเลขติดลบ = ระบบบันทึกของออกมากกว่าที่เข้า · ให้นับสต๊อกที่นั่นใหม่ แล้วตัวเลขจะกลับมาตรง</div>
    </div>`;

  const paint = mode => {
    app.querySelector('main').innerHTML = shell(mode==='pic' ? picture() : tableView(), mode);
    app.querySelector('.tabs').onclick = e=>{
      const b = e.target.closest('button'); if(b) paint(b.dataset.m);
    };
  };
  paint('pic');
}
</script>
</body>
</html>
